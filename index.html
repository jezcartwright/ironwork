        allExtras().filter(x => x.cat === cat).map(x=>
          '<button class="opt' + (already.includes(x.id) ? " used" : "") + '" data-addpick="' + x.id + '">' +
            icon(iconFor(x.id), 26) + '<b>' + esc(x.name) + '</b></button>').join("") +
      '</div>';
    });
    html += '<p class="eyebrow">Not listed</p><div class="opt-grid">' +
      '<button class="opt newx" data-act="openNew">' +
        '<svg viewBox="0 0 24 24" style="width:26px;height:26px" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>' +
        '<b>New</b></button></div>' +
      newExtraForm();
  }

  return html + '</div></div>';
}

/* ---------- live session ---------- */
function viewOpen(){
  const c = S.current;
  if(!c.entries.length) addOpen = true;

  /* With something logged, the activity card carries the name and icon, so a
     separate header would just repeat it. Only show one when nothing is chosen. */
  const header = c.entries.length ? "" :
    '<div class="panel"><div class="pad">' +
      '<p class="eyebrow">' + (c.retro
        ? "Logging " + esc(keyDate(c.retro).toLocaleDateString("en-GB", {weekday:"long", day:"numeric", month:"long"}))
        : "Aerobic &amp; open session") + '</p>' +
      '<h1 class="session-title" style="margin:0">Choose what you are doing</h1>' +
      '<p class="lede" style="margin-top:6px">' + (c.retro
        ? "Enter what you actually did. It will be filed on that date, not today."
        : "Does not use a programme slot — the next session on the rotation is still waiting for you.") + '</p>' +
    '</div></div>';

  const note = c.entries.length && c.retro
    ? '<div class="panel"><div class="pad"><p class="eyebrow" style="margin:0">Logging ' +
      esc(keyDate(c.retro).toLocaleDateString("en-GB", {weekday:"long", day:"numeric", month:"long"})) + '</p></div></div>'
    : "";

  return storageWarn() + header + note + extrasPanel() + finishPanel();
}

function finishPanel(){
  const c = S.current;
  const done = c.entries.reduce((n,e)=> n + e.sets.filter(s=>s.done).length, 0);
  const total = c.entries.reduce((n,e)=> n + e.sets.length, 0);
  const onlyGolf = c.entries.length > 0 && c.entries.every(e => entryProfile(e) === "golf");
  return '<div class="panel"><div class="pad">' +
    (onlyGolf ? "" :
      '<p class="eyebrow">' + done + ' of ' + total + ' sets logged · ' +
        Math.round((Date.now() - c.startedAt)/60000) + ' minutes elapsed</p>') +
    '<button class="btn" data-act="finish">Finish session</button>' +
    '<div style="height:10px"></div>' +
    '<button class="btn btn-ghost" data-act="abandon">Discard this session</button>' +
  '</div></div>';
}

function viewSession(){
  const c = S.current;
  if(c.open) return viewOpen();
  const sess = sessionAt(c.index);
  let html = storageWarn() +
    '<div class="panel"><div class="pad">' +
      '<div class="sess-head">' +
        '<span class="ex-icon lead">' + icon(sess.glyph, 20) + '</span>' +
        '<div style="min-width:0"><h1 class="session-title" style="font-size:32px">' + esc(sess.title) + '</h1>' +
        '<p class="eyebrow" style="margin:3px 0 0">' + esc(sess.lift) + ' · session ' + (c.index + 1) + '</p></div>' +
      '</div>' +
      '<p class="lede" style="margin-top:10px">' + esc(sess.blurb) + '</p>' +
      '<p class="focus-note" style="margin-top:12px">' + esc(FOCUS_CUES[c.index % FOCUS_CUES.length]) + '</p>' +
    '</div></div>';


  /* blocks */
  sess.blocks.forEach((b, bi)=>{
    const inBlock = c.entries.filter(e => e.block === bi);
    html += '<div class="panel"><div class="pad">';
    if(b.items.length > 1) html += '<span class="pair-flag">Superset — alternate, rest ' + b.rest + 's after the pair</span>';
    else html += '<span class="pair-flag">Rest ' + b.rest + 's between sets</span>';

    inBlock.forEach(entry=>{
      const item = b.items.find(x => x.slot === entry.slot);
      const ex = SLOTS[entry.slot].pool.find(x => x.id === entry.exId);
      const sug = suggest(ex, item, c.index);
      const lp = lastPerf(ex.id);
      const ghost = !lp ? "No history yet"
        : ex.bwOnly
          ? "Last: " + lp.entry.sets.filter(s=>s.done).map(s=>s.r).join(" · ") + " reps"
          : "Last: " + fmt(lp.entry.sets.filter(s=>s.done)[0].w) + " " + S.units + " × " +
            lp.entry.sets.filter(s=>s.done).map(s=>s.r).join(" · ");

      html += '<div class="ex" style="padding-top:16px;margin-top:16px">' +
        '<div class="ex-head">' +
          '<span class="ex-icon' + (entry.block === 0 ? " lead" : "") + '">' + icon(iconFor(entry.exId), 19) + '</span>' +
          '<div style="flex:1;min-width:0">' +
          '<button class="ex-name" data-diag="' + entry.exId + '">' + esc(ex.name) +
            (isNewVariant(entry.slot, c.index) ? '<span class="tag-new">New</span>' : '') +
            '<span class="chev">' + infoIcon(!!openDiag[entry.exId]) + '</span></button>' +
        '</div><button class="mini" data-swap="' + entry.slot + '">Swap</button></div>' +
        '<p class="target"><b>' + item.sets + ' × ' + item.lo + '–' + item.hi +
          (ex.perSide ? " each side" : "") + '</b>' +
          '<span>' + (ex.bwOnly ? "bodyweight" : sug.w === null ? "load to find" : fmt(sug.w) + " " + S.units + (ex.kind === "dumbbell" ? " per hand" : ex.kind === "bodyweight" ? " added" : "")) + '</span></p>' +
        '<p class="ghost">' + esc(ghost) + '</p>' +
        '<p class="cue">' + esc(sug.why) + '</p>' +
        '<div class="bar-line"></div><div class="sets">';

      html += setRows(entry, b.rest);

      html += '</div><p class="cue">' + esc(ex.cue) + '</p>' +
        (openDiag[entry.exId] ? diagram(entry.exId) : "") + '</div>';
    });
    html += '</div></div>';
  });

  html += extrasPanel();
  html += finishPanel();
  return html;
}

/* ---------- summary ---------- */
function viewSummary(){
  const rec = summaryRec;
  const sess = SESSIONS.find(s => s.key === rec.key);
  const title = rec.open ? (rec.title || "Open session") : (sess ? sess.title : "Session");
  const sets = rec.entries.reduce((n,e)=> n + e.sets.length, 0);
  const vol = rec.entries.reduce((n,e)=> n + ((e.track||"load")==="load" ? e.sets.reduce((m,s)=> m + s.w * s.r, 0) : 0), 0);
  const cardio = rec.entries.filter(e => entryProfile(e) !== "strength");

  let pbs = [];
  rec.entries.forEach(e=>{
    if((e.track||"load") !== "load") return;
    const f = findEx(e.exId);
    if(!f) return;
    const prev = allPerf(e.exId).slice(0, -1);
    const single = trueSingle(e.sets);
    if(single !== null){
      const priorSingle = prev.reduce((m,h)=> Math.max(m, h.single === null ? 0 : h.single), 0);
      if(single > priorSingle && priorSingle > 0)
        pbs.push(f.ex.name + " — one-rep max now " + fmt(single) + " " + S.units);
    }
    const best = topWeight(e.sets);
    const priorTop = prev.reduce((m,h)=> Math.max(m, h.top), 0);
    if(best > priorTop && priorTop > 0)
      pbs.push(f.ex.name + " — heaviest set now " + fmt(best) + " " + S.units);
  });

  const next = sessionAt(S.sessionIndex);
  return '<div class="panel"><div class="pad">' +
    '<p class="eyebrow">' + (rec.open ? "Logged · open session" : "Logged") + '</p>' +
    '<h1 class="session-title">' + esc(title) + '</h1>' +
    '<div class="meta">' +
      '<div><span class="n">' + rec.minutes + '<span style="font-size:12px">min</span></span><span class="l">Elapsed</span></div>' +
      '<div><span class="n">' + sets + '</span><span class="l">Sets</span></div>' +
      '<div><span class="n">' + Math.round(vol) + '</span><span class="l">Volume ' + S.units + '</span></div>' +
    '</div>' +
    (golfOnly(rec) ? "" : '<hr class="rule">' + effortBlock(rec) + durationBlock(rec)) +
    (cardio.length ? '<hr class="rule"><p class="eyebrow">Also logged</p>' +
      cardio.map(e=>{
        const f = findEx(e.exId);
        return '<p class="lede" style="margin-top:4px">' + esc(f ? f.ex.name : e.name || "Added work") +
          ' — ' + esc(entryLine(e)) + '</p>';
      }).join("") : "") +
    (pbs.length ? '<hr class="rule"><p class="pb">Personal best</p>' +
      pbs.map(p=>'<p class="lede" style="margin-top:4px">' + esc(p) + '</p>').join("") : "") +
    '<hr class="rule">' +
    '<p class="lede">Next up is <b>' + esc(next.title) + '</b>. ' + esc(next.blurb) + ' Leave a full day between sessions.</p>' +
    '<div style="margin-top:16px"><button class="btn btn-quiet" data-act="closeSummary">Done</button></div>' +
  '</div></div>';
}

/* ---------- progress ---------- */
function sparkline(vals){
  if(vals.length < 2) return "";
  const w = 240, h = 34, min = Math.min(...vals), max = Math.max(...vals);
  const span = (max - min) || 1;
  const pts = vals.map((v,i)=>
    (i / (vals.length - 1) * w).toFixed(1) + "," + (h - ((v - min) / span) * (h - 4) - 2).toFixed(1)
  ).join(" ");
  return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '" preserveAspectRatio="none" aria-hidden="true">' +
    '<polyline points="' + pts + '" fill="none" stroke="#FF6600" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}

function viewProgress(){
  if(!S.history.length){
    return '<div class="panel"><div class="pad"><p class="eyebrow">Progress</p>' +
      '<div class="empty">Nothing logged yet. Finish a session and your loads, estimated maxes and trends appear here.</div>' +
    '</div></div>';
  }
  const seen = [];
  S.history.forEach(h => h.entries.forEach(e => { if(!seen.includes(e.exId)) seen.push(e.exId); }));

  let rows = "";
  seen.forEach(exId=>{
    const f = findEx(exId);
    const hist = allPerf(exId);
    if(!hist.length) return;
    const name = f ? f.ex.name : "Removed exercise";
    const label = (f && f.slot && SLOT_SESSION[f.slot]) ? SLOT_SESSION[f.slot] : (f ? f.label : "Added");
    const tr = f ? (f.profile === "distance" ? "distance" : f.profile === "strength" ? "load" : "time") : "load";
    const cur = hist[hist.length - 1], first = hist[0];

    let head, sub, series;
    if(tr === "load"){
      const hasSingle = anySingle(hist);
      const curV = hasSingle ? (cur.single !== null ? cur.single : cur.top) : cur.top;
      const firstV = hasSingle ? (first.single !== null ? first.single : first.top) : first.top;
      const d = curV - firstV;
      const cls = d > 0.5 ? "delta-up" : d < -0.5 ? "delta-down" : "delta-flat";
      const heavy = cur.sets.reduce((m,x)=> x.w > m.w ? x : m, cur.sets[0]);
      head = fmt(curV) + " " + S.units;
      sub = label + ' · ' + hist.length + ' session' + (hist.length > 1 ? "s" : "") +
        ' · best set ' + fmt(heavy.w) + ' × ' + heavy.r +
        ' · <span class="' + cls + '">' + (d > 0 ? "+" : "") + fmt(d) + ' ' + S.units +
        (hasSingle ? ' one-rep max' : ' heaviest set') + '</span>';
      series = hist.map(x => (hasSingle && x.single !== null) ? x.single : x.top);
    }else if(tr === "distance"){
      const dist = x => x.sets.reduce((n,s)=> n + s.w, 0);
      const mins = x => x.sets.reduce((n,s)=> n + s.r, 0);
      const total = hist.reduce((n,x)=> n + dist(x), 0);
      head = fmt(Math.round(dist(cur) * 10) / 10) + " km";
      sub = label + ' · ' + hist.length + ' session' + (hist.length > 1 ? "s" : "") +
        ' · last ' + fmt(Math.round(dist(cur)*10)/10) + ' km in ' + fmt(mins(cur)) + ' min' +
        ' · <span class="delta-flat">' + fmt(Math.round(total * 10) / 10) + ' km total</span>';
      series = hist.map(dist);
    }else{
      const mins = x => x.sets.reduce((n,s)=> n + s.w, 0);
      const total = hist.reduce((n,x)=> n + mins(x), 0);
      const effort = cur.sets.reduce((n,s)=> n + s.r, 0) / cur.sets.length;
      head = fmt(mins(cur)) + " min";
      sub = label + ' · ' + hist.length + ' session' + (hist.length > 1 ? "s" : "") +
        ' · last effort ' + fmt(Math.round(effort * 10) / 10) + '/10' +
        ' · <span class="delta-flat">' + fmt(total) + ' min total</span>';
      series = hist.map(mins);
    }

    rows += '<div class="exrow">' +
      '<div class="exrow-top">' +
        '<span class="exrow-name">' + esc(name) + '</span>' +
        '<span class="exrow-n">' + head + '</span>' +
      '</div>' +
      '<div class="exrow-sub">' + sub + '</div>' +
      sparkline(series) +
    '</div>';
  });

  const totalVol = S.history.reduce((n,h)=> n + h.entries.reduce((m,e)=> m + ((e.track||"load")==="load" ? e.sets.reduce((k,s)=> k + s.w*s.r, 0) : 0), 0), 0);
  const recent = S.history.slice().reverse().map((h)=>{
    const i = S.history.indexOf(h);
    const sess = SESSIONS.find(s => s.key === h.key);
    const label = h.open ? (h.title || "Open session") : (sess ? sess.title : "Session");
    const d = keyDate(recDay(h));
    const first = h.entries[0];
    const gOnly = golfOnly(h);
    const detail = gOnly
      ? (((first || {}).meta || {}).score ? "score " + ((first.meta).score) : "round")
      : (h.open ? (h.minutes ? h.minutes + " min" : "logged")
                : h.entries.reduce((n,e)=> n + e.sets.length, 0) + " sets · " + (h.minutes || 0) + " min");
    return '<button class="histrow" data-hopen="' + i + '">' +
      '<span class="ex-icon' + (h.open ? "" : " lead") + '">' +
        icon(h.open && first ? iconFor(first.exId) : "barbell", 18) + '</span>' +
      '<span style="flex:1;min-width:0">' +
        '<b>' + esc(label) + '</b>' +
        '<span>' + d.toLocaleDateString("en-GB", {day:"numeric", month:"short"}) + ' · ' + esc(detail) +
          (h.effort ? ' · ' + h.effort + '/10' : '') + '</span>' +
      '</span><span class="chev-r">›</span></button>';
  }).join("");

  return '<div class="panel"><div class="pad">' +
      '<p class="eyebrow">Every session · ' + S.history.filter(h=>!h.open).length + ' weights, ' + S.history.filter(h=>h.open).length + ' aerobic</p>' +
      '<h2 class="head">' + S.history.length + ' sessions, ' + Math.round(totalVol).toLocaleString("en-GB") + ' ' + S.units + ' moved</h2>' +
      '<hr class="rule">' + recent +
    '</div></div>' +
    '<div class="panel"><div class="pad">' +
      '<p class="eyebrow">Every exercise logged</p>' + rows +
    '</div></div>';
}

/* ---------- library ---------- */
function viewLibrary(){

  let html = '<div class="panel"><div class="pad">' +

  '</div></div>';

  SESSIONS.forEach((x, n)=>{
    const upcoming = i + ((n - (i % 3)) + 3) % 3;
    let rows = "";
    x.blocks.forEach(b => b.items.forEach(item=>{
      const cur = variantFor(item.slot, upcoming);
      const pool = SLOTS[item.slot].pool;
      const ordered = [cur].concat(pool.filter(v => v.id !== cur.id));
      rows += '<div class="varrow">' +
        '<p class="slotnote">' + item.sets + ' \u00d7 ' + item.lo + '\u2013' + item.hi +
          ' \u00b7 ' + pool.length + ' variations</p>' +
        ordered.map(v=>
          '<div class="varone' + (v.id === cur.id ? " now" : "") + '">' +
            '<button class="ex-name" style="font-size:16px" data-diag="' + v.id + '">' + esc(v.name) +
              (v.id === cur.id ? '<span class="nowtag">in use</span>' : '') +
              '<span class="chev">' + infoIcon(!!openDiag[v.id]) + '</span></button>' +
            (openDiag[v.id] ? '<p class="cue">' + esc(v.cue) + '</p>' + diagram(v.id) : "") +
          '</div>').join("") +
      '</div>';
    }));

    const count = x.blocks.reduce((t,b)=> t + b.items.reduce((u,it)=> u + SLOTS[it.slot].pool.length, 0), 0);
    html += '<div class="panel"><div class="pad">' +
      '<h2 class="head">' + esc(x.title) + '</h2>' +
      '<p class="lede" style="margin-top:6px">' + esc(x.blurb) + '</p>' +
      '<p class="lede" style="margin-top:8px;font-size:13px">' + esc(x.trains) + '</p>' +
      '<div class="tags" style="margin-top:10px">' + x.tags.map(t=>'<span class="tag">' + esc(t) + '</span>').join("") + '</div>' +
      '<p class="eyebrow" style="margin-top:16px">All ' + count + ' exercises \u00b7 tap any for how it is done</p>' +
      rows +
      '<p class="lede" style="margin-top:12px;font-size:12px">Every four cycles each lift swaps to the next variation, so the training stays comparable but never repeats.</p>' +
    '</div></div>';
  });

  const cats = [];
  allExtras().forEach(x=>{ if(!cats.includes(x.cat)) cats.push(x.cat); });
  html += '<div class="panel"><div class="pad">' +
    '<p class="eyebrow">Add-ons</p>' +
    '<h2 class="head">Anything else you train</h2>' +
    '<p class="lede" style="margin-top:8px">These appear when you start an aerobic session, or add to a weights session. Anything you create is saved here for good.</p>' +
    '<hr class="rule">' +
    cats.map(cat=>
      '<div class="libslot"><h3>' + esc(cat) + '</h3><ul>' +

          esc((PROFILES[profileOf(x)] || PROFILES.duration).label) + '</span>' +
        (x.cat === "Yours"
          ? '<div class="seg" style="margin:7px 0 4px">' +
              Object.keys(PROFILES).map(k=>
                '<button data-setprofile="' + k + ':' + x.id + '" class="' +
                  ((PROFILES[entryProfile({exId:x.id, name:x.name})] === PROFILES[k]) ? "on" : "") + '">' +
                  esc(PROFILES[k].label) + '</button>').join("") +

  return html;

    '<p class="lede" style="margin:8px 0 0;font-size:11.5px">Clears everything cached, including exercise illustrations, and reloads. Use it after new artwork goes up.</p>' +
    '<div style="height:8px"></div>' +
    '<div style="height:8px"></div>' +
    '<button class="btn btn-ghost" data-act="reset">Erase everything and start over</button>' +
  '</div></div>';
}

/* ============================================================
   EVENTS
   ============================================================ */
function setVal(id, field, val){
  const [exId, si] = id.split(":");
  const e = S.current.entries.find(x => x.exId === exId);
  if(!e) return;
  e.sets[Number(si)][field] = val;
}

document.addEventListener("click", e=>{
  const t = e.target.closest("[data-tab],[data-act],[data-done],[data-nudge],[data-swap],[data-units],[data-bar],[data-rest],[data-diag],[data-rmx],[data-addset],[data-newtrack],[data-delcustom],[data-pick],[data-addpick],[data-day],[data-hopen],[data-hnudge],[data-haddset],[data-hrmset],[data-hrmex],[data-rot],[data-newicon],[data-effort],[data-mins],[data-hadd],[data-figure],[data-feel],[data-place],[data-coursepick],[data-courseown],[data-courseclear],[data-tee],[data-holes],[data-score],[data-geffort],[data-parstep],[data-setprofile],[data-histfilter],[data-histex],[data-family]");
  if(!t) return;

  if(t.dataset.diag){
    const id = t.dataset.diag;
    if(openDiag[id]) delete openDiag[id]; else openDiag[id] = true;
    render(); return;
  }

  if(t.dataset.tab){ summaryRec = null; histIdx = null; histEx = null; histList = false; histDay = null; previewOpen = false; previewIdx = null; tab = t.dataset.tab; render(); return; }

  if(t.dataset.rest){
    if(t.dataset.rest === "add"){ restLeft += 30; drawRest(); }
    else stopRest();
    return;
  }


  if(t.dataset.swap){
    const slot = t.dataset.swap;
    S.nudge[slot] = (S.nudge[slot] || 0) + 1;
    const ex = variantFor(slot, S.current.index);
    const entry = S.current.entries.find(x => x.slot === slot);
    const sess = sessionAt(S.current.index);
    const item = sess.blocks[entry.block].items.find(x => x.slot === slot);
    const sug = suggest(ex, item, S.current.index);
    entry.exId = ex.id;
    entry.sets = Array.from({length:item.sets}, ()=>({w: sug.w === null ? "" : sug.w, r:item.hi, done:false}));
    save(); render(); return;
  }

  if(t.dataset.nudge){
    const [field, dir, exId, si] = t.dataset.nudge.split(":");
    const entry = S.current.entries.find(x => x.exId === exId);
    const P = PROFILES[entryProfile(entry)] || PROFILES.duration;
    const cfg = field === "w" ? P.a : P.b;
    if(!cfg) return;
    const set = entry.sets[Number(si)];
    let st = cfg.step;
    if(st === null){ const f = findEx(exId); st = f && f.ex.kind ? step(f.ex.kind) : 2.5; }
    const cur = Number(field === "w" ? set.w : set.r) || 0;
    const v = Math.max(0, Math.round((cur + Number(dir) * st) / st) * st);
    if(field === "w") set.w = v; else set.r = v;
    save(); render(); return;
  }

  if(t.dataset.rmx){
    const i = S.current.entries.findIndex(x => x.exId === t.dataset.rmx && x.extra);
    if(i >= 0) S.current.entries.splice(i, 1);
    save(); render(); return;
  }

  if(t.dataset.addset){
    const entry = S.current.entries.find(x => x.exId === t.dataset.addset);
    const last = entry.sets[entry.sets.length - 1];
    const P = PROFILES[entryProfile(entry)] || PROFILES.duration;
    entry.sets.push({w: last ? last.w : (P.a ? P.a.def : 0), r: last ? last.r : (P.b ? P.b.def : 0), done:false});
    save(); render(); return;
  }

  if(t.dataset.setprofile){
    const bits = t.dataset.setprofile.split(":");
    const ex = (S.custom || []).find(x => x.id === bits.slice(1).join(":"));
    if(ex){ ex.profile = bits[0]; ex.profileLocked = true; save(); render(); }
    return;
  }

  if(t.dataset.delcustom){
    const id = t.dataset.delcustom;
    const ex = S.custom.find(x => x.id === id);
    if(ex && confirm('Remove "' + ex.name + '" from the dropdown? Sessions already logged keep their record.')){
      S.custom = S.custom.filter(x => x.id !== id);
      save(); render();
    }
    return;
  }

  if(t.dataset.addpick){
    addExtraToSession(t.dataset.addpick);
    addOpen = false; newExtra.open = false;
    render(); return;
  }

  if(t.dataset.pick){
    pick.family = null; pick.sel = (pick.sel === t.dataset.pick ? null : t.dataset.pick); render(); return; }

  if(t.dataset.feel){
    const [val, ...c] = t.dataset.feel.split(":");
    const e = ctxEntry(c.join(":"));
    if(e){ e.meta = e.meta || {}; e.meta.feel = (e.meta.feel === val ? null : val); save(); render(); }
    return;
  }

  if(t.dataset.place){
    const bits = t.dataset.place.split(":");
    const val = bits[0], e = ctxEntry(bits.slice(1).join(":"));
    if(e){ e.meta = e.meta || {}; e.meta.where = val; save(); render(); }
    return;
  }

  if(t.dataset.coursepick){
    const bits = t.dataset.coursepick.split(":");
    const e = ctxEntry(bits.slice(1).join(":"));
    if(e) pickCourse(e, courseHits[Number(bits[0])], bits.slice(1).join(":"));
    return;
  }

  if(t.dataset.courseown){
    const e = ctxEntry(t.dataset.courseown);
    if(e && courseQ.trim()){
      e.meta = e.meta || {};
      e.meta.course = courseQ.trim(); e.meta.tees = []; e.meta.tee = null;
      rememberCourse({name:e.meta.course, tees:[]});
      courseQ = ""; courseHits = [];
      save(); render();
    }
    return;
  }

  if(t.dataset.courseclear){
    const e = ctxEntry(t.dataset.courseclear);
    if(e){ e.meta.course = null; e.meta.tees = []; e.meta.tee = null; courseQ = ""; courseHits = []; save(); render(); }
    return;
  }

  if(t.dataset.tee){
    const bits = t.dataset.tee.split(":");
    const e = ctxEntry(bits.slice(1).join(":"));
    if(e){ e.meta.tee = (e.meta.tee === Number(bits[0]) ? null : Number(bits[0])); save(); render(); }
    return;
  }

  if(t.dataset.holes){
    const bits = t.dataset.holes.split(":");
    const e = ctxEntry(bits.slice(1).join(":"));
    if(e){ e.meta.holes = Number(bits[0]); save(); render(); }
    return;
  }

  if(t.dataset.score){
    const bits = t.dataset.score.split(":");
    const e = ctxEntry(bits.slice(1).join(":"));
    if(e){ e.meta.score = Math.max(0, (Number(e.meta.score) || 0) + Number(bits[0])); save(); render(); }
    return;
  }

  if(t.dataset.geffort){
    const parts = t.dataset.geffort.split(":");
    const n = Number(parts[0]);
    const e = ctxEntry(parts.slice(1).join(":"));
    if(e){
      e.meta = e.meta || {};
      e.meta.effort = (e.meta.effort === n) ? null : n;
      const rec = targetRec();
      if(rec && golfOnly(rec)) rec.effort = e.meta.effort;
      save(); render();
    }
    return;
  }

  if(t.dataset.parstep){
    const parts = t.dataset.parstep.split(":");
    const e = ctxEntry(parts.slice(1).join(":"));
    if(e){
      e.meta = e.meta || {};
      e.meta.parManual = Math.max(0, (Number(e.meta.parManual) || 70) + Number(parts[0]));
      save(); render();
    }
    return;
  }

  if(t.dataset.effort){
    const rec = targetRec();
    if(rec){
      const n = Number(t.dataset.effort);
      rec.effort = (rec.effort === n) ? null : n;
      save(); render();
    }
    return;
  }

  if(t.dataset.mins){
    const rec = targetRec();
    if(rec){
      rec.minutes = Math.max(0, (Number(rec.minutes) || 0) + Number(t.dataset.mins));
      save(); render();
    }
    return;
  }

  if(t.dataset.rot){
    previewIdx = Number(t.dataset.rot); previewOpen = true;
    histIdx = null; histList = false; render(); return;
  }

  if(t.dataset.family){
    pick.family = Number(t.dataset.family); render(); return;
  }

  if(t.dataset.histex){
    histEx = t.dataset.histex; histIdx = null; histList = false; histDay = null;
    previewOpen = false; tab = "train"; render(); return;
  }

  if(t.dataset.day){
    const key = t.dataset.day;
    const hits = S.history.map((h,i)=>({h:h,i:i})).filter(r => recDay(r.h) === key);
    if(!hits.length) return;
    if(hits.length === 1){ histIdx = hits[0].i; histList = false; }
    else { histDay = key; histList = true; histIdx = null; }
    previewOpen = false; render(); return;
  }

  if(t.dataset.hadd){
    const h = S.history[histIdx];
    const exId = t.dataset.hadd;
    if(h && !h.entries.some(e => e.exId === exId)){
      const f = findEx(exId);
      const P = PROFILES[f.profile] || PROFILES.duration;
      h.entries.push({
        slot: f.slot || null, exId: exId, profile: f.profile, track: f.track,
        extra: !f.slot, name: f.ex.name, meta:{},
        sets: P.golf ? [] : [{w: P.a ? P.a.def : 0, r: P.b ? P.b.def : 0, done:true}]
      });
      histAdd = false;
      save(); render();
    }
    return;
  }

  if(t.dataset.histfilter){ histFilter = t.dataset.histfilter; render(); return; }

  if(t.dataset.hopen !== undefined){
    histIdx = Number(t.dataset.hopen); histList = false; histAdd = false; render(); return;
  }

  if(t.dataset.hnudge){
    const [field, dir, ei, si] = t.dataset.hnudge.split(":");
    const entry = S.history[histIdx].entries[Number(ei)];
    const P = PROFILES[entryProfile(entry)] || PROFILES.duration;
    const cfg = field === "w" ? P.a : P.b;
    if(!cfg) return;
    const set = entry.sets[Number(si)];
    let st = cfg.step;
    if(st === null){ const f = findEx(entry.exId); st = f && f.ex.kind ? step(f.ex.kind) : 2.5; }
    const cur = Number(set[field === "w" ? "w" : "r"]) || 0;
    const v = Math.max(0, Math.round((cur + Number(dir)*st) / st) * st);
    if(field === "w") set.w = v; else set.r = v;
    save(); render(); return;
  }

  if(t.dataset.haddset){
    const entry = S.history[histIdx].entries[Number(t.dataset.haddset)];
    const last = entry.sets[entry.sets.length - 1];
    entry.sets.push({w: last ? last.w : 0, r: last ? last.r : 0, done:true});
    save(); render(); return;
  }

  if(t.dataset.hrmset){
    const [ei, si] = t.dataset.hrmset.split(":").map(Number);
    const entry = S.history[histIdx].entries[ei];
    entry.sets.splice(si, 1);
    if(!entry.sets.length) S.history[histIdx].entries.splice(ei, 1);
    if(!S.history[histIdx].entries.length){
      if(confirm("That was the last set in this session. Delete the session?")){
        S.history.splice(histIdx, 1); histIdx = null;
      }else{
        S.history[histIdx].entries.push(entry); entry.sets.push({w:0, r:0, done:true});
      }
    }
    save(); render(); return;
  }

  if(t.dataset.hrmex){
    const ei = Number(t.dataset.hrmex);
    const entry = S.history[histIdx].entries[ei];
    const f = findEx(entry.exId);
    if(confirm("Remove " + (entry.name || (f ? f.ex.name : "this exercise")) + " from this session?")){
      S.history[histIdx].entries.splice(ei, 1);
      if(!S.history[histIdx].entries.length){ S.history.splice(histIdx, 1); histIdx = null; }
      save(); render();
    }
    return;
  }

  if(t.dataset.newicon){ newExtra.icon = t.dataset.newicon; newExtra.showIcons = false; render(); return; }
  if(t.dataset.newtrack){ newExtra.profile = t.dataset.newtrack; render(); return; }

  if(t.dataset.done){
    const parts = t.dataset.done.split(":");
    const exId = parts[0], si = Number(parts[1]), rest = Number(parts[2]);
    const entry = S.current.entries.find(x => x.exId === exId);
    const set = entry.sets[si];
    set.done = !set.done;
    if(set.done){
      /* extras have no slot, so resolve the name the general way */
      const f = findEx(exId);
      const label = entry.name || (f ? f.ex.name : "Rest");
      startRest(rest, "Rest · " + label);
      /* carry the load forward to the remaining sets */
      for(let k = si + 1; k < entry.sets.length; k++){
        if(!entry.sets[k].done) entry.sets[k].w = set.w;
      }
    }
    save(); render(); return;
  }

  if(t.dataset.figure){ S.figure = t.dataset.figure; save(); render(); return; }
  if(t.dataset.units){ S.units = t.dataset.units; save(); render(); return; }
  if(t.dataset.bar){ S.bar = Math.max(0, S.bar + Number(t.dataset.bar) * 2.5); save(); render(); return; }

  const act = t.dataset.act;
  if(act === "addExtra"){
    const sel = document.getElementById("extraPick");
    if(sel && sel.value) addExtraToSession(sel.value);
    return;
  }
  if(act === "toggleAdd"){ addOpen = !addOpen; newExtra.open = false; render(); return; }
  if(act === "openPicker"){ pick = {open:true, sel:null, when:null, family:null}; newExtra.open = false; render(); return; }
  if(act === "clearFamily"){ pick.family = null; render(); return; }
  if(act === "closePicker"){ pick = {open:false, sel:null, when:null, family:null}; newExtra.open = false; render(); return; }
  if(act === "startPicked"){
    const chosen = pick.sel;
    const when = pick.when;
    pick = {open:false, sel:null, when:null, family:null};
    startOpen(when && when !== dayKey(new Date()) ? when : null);
    if(chosen) addExtraToSession(chosen);
    return;
  }
  if(act === "whenToday"){ pick.when = null; render(); return; }
  if(act === "openNew"){ newExtra = {open:true, name:"", profile:"duration", icon:null, showIcons:false}; render(); return; }
  if(act === "cancelNew"){ newExtra.open = false; newExtra.showIcons = false; render(); return; }
  if(act === "toggleIcons"){ newExtra.showIcons = !newExtra.showIcons; render(); return; }
  if(act === "saveNew"){
    const name = (newExtra.name || "").trim();
    if(!name){ alert("Give the exercise a name first."); return; }
    const id = "c-" + name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + "-" + Date.now().toString(36).slice(-4);
    S.custom.push({id:id, name:name, cat:"Yours", profile:newExtra.profile,
                   icon: newExtra.icon || guessIcon(name, newExtra.profile)});
    newExtra = {open:false, name:"", profile:"duration", icon:null, showIcons:false};
    save();
    if(S.current) addExtraToSession(id); else { pick.sel = id; render(); }
    return;
  }
  if(act === "clearEffort"){
    const rec = targetRec();
    if(rec){ rec.effort = null; save(); render(); }
    return;
  }
  if(act === "logPast"){
    const d = new Date(); d.setDate(d.getDate() - 1);
    pick = {open:true, sel:null, when:dayKey(d)};
    histList = false; histIdx = null; newExtra.open = false;
    render(); return;
  }
  if(act === "histList"){ histList = true; histDay = null; histIdx = null; previewOpen = false; render(); return; }
  if(act === "toggleHistAdd"){ histAdd = !histAdd; render(); return; }
  if(act === "closeHist"){ histIdx = null; histEx = null; histList = false; histDay = null; histAdd = false; histFilter = "all"; render(); return; }
  if(act === "delSession"){
    const h = S.history[histIdx];
    if(h && confirm("Delete " + sessionTitle(h) + " from " + niceDate(h.date) + "? This cannot be undone.")){
      S.history.splice(histIdx, 1);
      histIdx = null;
      save(); render();
    }
    return;
  }
  if(act === "preview"){ previewIdx = null; previewOpen = true; render(); return; }
  if(act === "closePreview"){ previewOpen = false; previewIdx = null; render(); return; }
  if(act === "signout"){
    if(confirm("Sign out? Your training is saved to your account.")){
      if(window.__auth) window.__auth.signOut();
    }
    return;
  }
  if(act === "start"){ previewOpen = false; previewIdx = null; startSession(); }
  if(act === "startOpen"){ startOpen(); }
  if(act === "startOpenPick"){
    const sel = document.getElementById("openPick");
    const pick = sel ? sel.value : "";
    startOpen();
    if(pick) addExtraToSession(pick);
    return;
  }
  if(act === "finish"){ stopRest(); finishSession(); }
  if(act === "abandon"){
    if(confirm("Discard this session? Nothing will be saved.")){ stopRest(); S.current = null; save(); render(); }
  }
  if(act === "closeSummary"){ summaryRec = null; render(); }
  if(act === "export"){
    const txt = JSON.stringify(S.history, null, 2);
    navigator.clipboard ? navigator.clipboard.writeText(txt).then(()=>alert("History copied to the clipboard.")) : alert(txt);
  }
  if(act === "forceUpdate"){
    (async ()=>{
      try{
        if(window.caches){
          const keys = await caches.keys();
          /* everything, artwork included — a redrawn diagram keeps its filename,
             so sparing the art cache means the old picture survives forever */
          await Promise.all(keys.map(k => caches.delete(k)));
        }
        if(navigator.serviceWorker){
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r => r.unregister()));
        }
      }catch(e){}
      location.reload(true);
    })();
    return;
  }
  if(act === "reset"){
    if(confirm("Erase every session, weight and record? This cannot be undone.")){
      S = blankState(); summaryRec = null; save(); render();
    }
  }
});

document.addEventListener("input", e=>{
  const t = e.target;
  if(t.dataset.in){
    const [field, exId, si] = t.dataset.in.split(":");
    setVal(exId + ":" + si, field, t.value === "" ? "" : Number(t.value));
    save();
  }
  if(t.dataset.coursesearch !== undefined){
    clearTimeout(window.__courseTimer);
    const q = t.value;
    courseQ = q;
    window.__courseTimer = setTimeout(()=> searchCourses(q), 350);
  }
  if(t.dataset.meta){
    const [key, ...c] = t.dataset.meta.split(":");
    const e = ctxEntry(c.join(":"));
    if(e){ e.meta = e.meta || {}; e.meta[key === "teename" ? "teeName" : key] = t.value; save(); }
  }
  if(t.dataset.scorein !== undefined){
    const e = ctxEntry(t.dataset.scorein);
    if(e){ e.meta = e.meta || {}; e.meta.score = Math.max(0, Number(t.value) || 0); save(); }
  }
  if(t.hasAttribute("data-when")){ pick.when = t.value || null; render(); }
  if(t.hasAttribute("data-minsin")){
    const rec = targetRec();
    if(rec){ rec.minutes = Math.max(0, Number(t.value) || 0); save(); }
  }
  if(t.hasAttribute("data-hdate")){
    const h = S.history[histIdx];
    if(h && t.value){
      const d = keyDate(t.value);
      h.date = d.toISOString(); h.day = dayKey(d);
      save(); render();
    }
    return;
  }
  if(t.dataset.hin){
    const [field, ei, si] = t.dataset.hin.split(":");
    const set = S.history[histIdx].entries[Number(ei)].sets[Number(si)];
    set[field] = t.value === "" ? 0 : Number(t.value);
    save();
  }
  if(t.dataset.new === "name"){
    const before = newExtra.icon || guessIcon(newExtra.name, newExtra.profile);
    newExtra.name = t.value;
    const after = newExtra.icon || guessIcon(newExtra.name, newExtra.profile);
    if(after !== before){
      const host = document.querySelector(".newico");
      if(host) host.innerHTML = icon(after, 24);
    }
  }
  if(t.hasAttribute("data-bar-in")){ S.bar = Number(t.value) || 0; save(); }
});

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").then(reg=>{
      /* look for a newer app every time the page opens, and on returning to it */
      reg.update();
      document.addEventListener("visibilitychange", ()=>{
        if(!document.hidden) reg.update();
      });
      reg.addEventListener("updatefound", ()=>{
        const sw = reg.installing;
        if(!sw) return;
        sw.addEventListener("statechange", ()=>{
          if(sw.state === "installed" && navigator.serviceWorker.controller){
            sw.postMessage("skipWaiting");
          }
        });
      });
    }).catch(()=>{});
    let reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", ()=>{
      if(reloaded) return;
      reloaded = true;
      location.reload();
    });
  });
}

window.ironworkSignedIn = async function(uid, profile){
  UID = uid;
  S = null;
  ACCOUNT = profile || {};
  stopRest();
  summaryRec = null; tab = "train"; pick = {open:false, sel:null}; addOpen = false;
  await loadState();
  document.getElementById("gate").hidden = true;
  render();
};

window.ironworkSignedOut = function(){
  UID = null; ACCOUNT = {}; S = blankState();
  document.getElementById("gate").hidden = false;
  document.getElementById("view").innerHTML = "";
};

(async function(){
  await loadState();
  render();
  setInterval(()=>{ if(S.current && tab === "train" && !summaryRec){ /* keep elapsed fresh, cheap */ } }, 60000);
})();

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
         signOut, GoogleAuthProvider, signInWithPopup, sendPasswordResetEmail,
         setPersistence, browserLocalPersistence }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, enableIndexedDbPersistence }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { FIREBASE_CONFIG } from "./firebase-config.js";

const gate = document.getElementById("gate");
const msg  = document.getElementById("gateMsg");
const email = document.getElementById("gEmail");
const pass  = document.getElementById("gPass");

function say(text, kind){
  msg.textContent = text;
  msg.className = "msg " + (kind || "err");
  msg.hidden = !text;
}
function friendly(e){
  const c = (e && e.code) || "";
  if(c.includes("invalid-credential") || c.includes("wrong-password") || c.includes("user-not-found"))
    return "That email and password do not match an account.";
  if(c.includes("email-already-in-use")) return "That email already has an account. Try signing in.";
  if(c.includes("weak-password")) return "Passwords need to be at least six characters.";
  if(c.includes("invalid-email")) return "That does not look like an email address.";
  if(c.includes("too-many-requests")) return "Too many attempts. Wait a minute and try again.";
  if(c.includes("popup-blocked")) return "Your browser blocked the Google popup. Allow popups and retry.";
  if(c.includes("popup-closed")) return "The Google window closed before sign-in finished.";
  if(c.includes("unauthorized-domain")) return "This domain is not authorised in Firebase yet. Add it under Authentication, Settings, Authorized domains.";
  if(c.includes("network")) return "No connection. Sign in once online and the app works offline after that.";
  return "Something went wrong signing in. Please try again.";
}

if(!FIREBASE_CONFIG.apiKey || !FIREBASE_CONFIG.projectId){
  gate.hidden = false;
  document.getElementById("gateSub").textContent =
    "Accounts are not configured yet. Add your Firebase project details to firebase-config.js.";
  ["gSignIn","gCreate","gGoogle","gReset"].forEach(id=>{
    const b = document.getElementById(id); b.disabled = true; b.style.opacity = ".45";
  });
}else{
  const app  = initializeApp(FIREBASE_CONFIG);
  const auth = getAuth(app);
  const db   = getFirestore(app);
  enableIndexedDbPersistence(db).catch(()=>{});
  await setPersistence(auth, browserLocalPersistence).catch(()=>{});

  window.__auth = { signOut: ()=> signOut(auth) };
  window.__cloud = {
    async get(uid){
      const snap = await getDoc(doc(db, "ironwork", uid));
      return snap.exists() ? snap.data().state : null;
    },
    async set(uid, state){
      await setDoc(doc(db, "ironwork", uid), { state: state, updatedAt: Date.now() });
    }
  };

  const busy = (on)=> ["gSignIn","gCreate","gGoogle"].forEach(id=>{
    const b = document.getElementById(id); b.disabled = on; b.style.opacity = on ? ".55" : "1";
  });

  document.getElementById("gSignIn").addEventListener("click", async ()=>{
    say(""); busy(true);
    try{ await signInWithEmailAndPassword(auth, email.value.trim(), pass.value); }
    catch(e){ say(friendly(e)); }
    busy(false);
  });

  document.getElementById("gCreate").addEventListener("click", async ()=>{
    say(""); busy(true);
    try{ await createUserWithEmailAndPassword(auth, email.value.trim(), pass.value); }
    catch(e){ say(friendly(e)); }
    busy(false);
  });

  document.getElementById("gGoogle").addEventListener("click", async ()=>{
    say(""); busy(true);
    try{ await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch(e){ say(friendly(e)); }
    busy(false);
  });

  document.getElementById("gReset").addEventListener("click", async ()=>{
    const addr = email.value.trim();
    if(!addr){ say("Type your email address first, then tap reset."); return; }
    try{
      await sendPasswordResetEmail(auth, addr);
      say("Reset link sent. Check your inbox.", "ok");
    }catch(e){ say(friendly(e)); }
  });

  pass.addEventListener("keydown", e=>{ if(e.key === "Enter") document.getElementById("gSignIn").click(); });

  onAuthStateChanged(auth, async (user)=>{
    if(user){
      say("");
      pass.value = "";
      await window.ironworkSignedIn(user.uid, {
        name: user.displayName || "",
        email: user.email || ""
      });
    }else{
      window.ironworkSignedOut();
    }
  });
}
</script>
</body>
</html>
