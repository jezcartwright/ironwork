<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Ironwork</title>
<meta name="description" content="Strength and conditioning tracker.">
<meta name="theme-color" content="#1B1A18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Ironwork">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --iron:#1B1A18;
  --iron-2:#26241F;
  --iron-3:#3A362E;
  --iron-line:#4A453B;
  --paper:#EDE9DF;
  --paper-2:#E3DED1;
  --paper-3:#D5CFBE;
  --rule:#C6BFAC;
  --slate:#6E685C;
  --ink:#1B1A18;
  --orange:#FF6600;
  --orange-deep:#C24E00;
  --orange-pale:#FFE0C4;
  --green:#2F6E4A;
  --green-pale:#D3E4D8;
  --ui:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--iron);
  color:var(--paper);
  font-family:var(--ui);
  font-size:16px;
  line-height:1.45;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}

.gate{position:fixed;inset:0;z-index:200;background:var(--iron);
  display:flex;align-items:center;justify-content:center;padding:24px;overflow-y:auto}
.gate[hidden]{display:none}
.gate-card{width:100%;max-width:360px}
.gate .logo{width:52px;height:36px;margin-bottom:20px}
.gate h1{font-family:var(--display);font-weight:700;font-size:38px;line-height:1;margin:0 0 6px;color:var(--paper)}
.gate p.sub{font-size:14px;color:#9A9384;margin:0 0 22px;line-height:1.5}
.gate label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:#9A9384;margin:0 0 6px}
.gate input{width:100%;padding:14px;margin-bottom:14px;border-radius:2px;
  background:var(--iron-2);border:1px solid var(--iron-line);color:var(--paper);font-size:16px}
.gate input:focus{outline:none;border-color:var(--orange)}
.gate .btn{margin-bottom:10px}
.gate .btn-alt{background:var(--iron-2);color:var(--paper);border:1px solid var(--iron-line)}
.gate .link{display:block;width:100%;text-align:center;font-size:13px;color:#9A9384;padding:10px}
.gate .link u{color:var(--orange);text-decoration:none;border-bottom:1px solid var(--orange)}
.gate .msg{font-size:13px;line-height:1.5;padding:11px 12px;border-radius:2px;margin:0 0 14px}
.gate .msg.err{background:#3A2418;color:#FFB27A}
.gate .msg.ok{background:#1F3327;color:#9FD3B0}
.gate .msg[hidden]{display:none}
.gate .or{display:flex;align-items:center;gap:12px;margin:16px 0;color:#6E685C;
  font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.gate .or::before,.gate .or::after{content:"";flex:1;height:1px;background:var(--iron-line)}
.acct{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.acct .who{flex:1;min-width:0}
.acct .who b{display:block;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct .who span{font-family:var(--mono);font-size:11px;color:var(--slate)}
.sync{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--slate)}
.sync.on{color:var(--green)}
.sync.off{color:var(--orange-deep)}

/* ---------- masthead ---------- */
.masthead{
  position:sticky;top:0;z-index:40;
  background:var(--iron);
  border-bottom:1px solid var(--iron-line);
}
.masthead-in{
  max-width:560px;margin:0 auto;padding:14px;
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
}
.mark{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:26px;display:block;flex:0 0 38px}
.mark-name{
  font-family:var(--ui);font-weight:700;font-size:15px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--paper);
}
.mark-sub{font-family:var(--mono);font-size:11px;color:#9A9384;letter-spacing:.04em}

/* ---------- panels ---------- */
.panel{
  background:var(--paper);color:var(--ink);
  border-radius:3px;
  margin:14px 0;
}
.panel-dark{
  background:var(--iron-2);color:var(--paper);
  border:1px solid var(--iron-line);border-radius:3px;
  margin:14px 0;
}
.pad{padding:16px}
.eyebrow{
  font-family:var(--mono);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--slate);margin:0 0 6px;
}
.eyebrow-l{color:#9A9384}
h1.session-title{
  font-family:var(--display);font-weight:700;font-size:40px;line-height:1;
  margin:0 0 4px;letter-spacing:-.01em;
}
h2.head{
  font-family:var(--display);font-weight:700;font-size:26px;line-height:1.1;margin:0 0 2px;
}
.lede{font-size:14px;color:var(--slate);margin:0}
.lede-l{color:#9A9384}
.rule{height:1px;background:var(--rule);border:0;margin:14px 0}
.rule-d{height:1px;background:var(--iron-line);border:0;margin:14px 0}

/* ---------- meta strip ---------- */
.meta{display:flex;gap:0;margin:14px 0 0;border-top:1px solid var(--rule)}
.meta div{flex:1;padding:10px 0 0;border-right:1px solid var(--rule)}
.meta div:last-child{border-right:0}
.meta .n{font-family:var(--mono);font-weight:600;font-size:19px;display:block;line-height:1.1}
.meta .l{font-size:11px;color:var(--slate);letter-spacing:.04em}

/* ---------- buttons ---------- */
.btn{
  display:block;width:100%;text-align:center;
  background:var(--orange);color:#FFFFFF;
  font-weight:700;font-size:15px;letter-spacing:.05em;text-transform:uppercase;
  padding:17px 16px;border-radius:2px;
  transition:transform .08s ease;
}
.btn:active{transform:translateY(2px)}
.btn-quiet{
  background:var(--paper-2);color:var(--ink);border:1px solid var(--rule);
}
.btn-ghost{
  background:none;border:1px solid var(--rule);color:var(--slate);
  font-size:13px;padding:12px;text-transform:none;letter-spacing:0;font-weight:500;
}
.btn-ghost:active{transform:none;background:var(--paper-2)}
.mini{
  font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--slate);border-bottom:1px solid var(--rule);padding:2px 0;
}
.mini:active{color:var(--orange);border-color:var(--orange)}


/* ---------- exercise card ---------- */
.ex{border-top:1px solid var(--rule)}
.ex:first-child{border-top:0}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:11px}
.ex-name{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.08;margin:0;
  display:block;text-align:left;padding:0;color:var(--ink);width:100%}
.ex-name .chev{
  display:inline-flex;margin-left:9px;vertical-align:-4px;color:var(--orange-deep);
}
.diag{display:flex;gap:10px;margin:14px 0 0;background:var(--paper-2);padding:12px;border-radius:2px}
.diag figure{flex:1;margin:0;min-width:0}
.diag svg{width:100%;height:auto;display:block}
.diag figcaption{font-size:11px;color:var(--slate);text-align:center;margin-top:6px;line-height:1.35}
.dfig{stroke:var(--ink);stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dkit{fill:var(--orange);stroke:none}
.dprop{stroke:var(--slate);stroke-width:3;fill:none;stroke-linecap:round}
.dground{stroke:var(--rule);stroke-width:3;stroke-linecap:round}
.dcable{stroke:var(--orange-deep);stroke-width:2;fill:none}
.ex-pattern{
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--slate);margin:0 0 3px;
}
.tag-new{
  display:inline-block;background:var(--orange-pale);color:var(--orange-deep);
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  padding:2px 6px;border-radius:2px;margin-left:6px;vertical-align:2px;
}
.target{
  font-family:var(--mono);font-size:13px;font-weight:500;margin:10px 0 0;
  display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;
}
.target b{color:var(--orange-deep);font-weight:600}
.ghost{font-family:var(--mono);font-size:12px;color:var(--slate);margin:4px 0 0}
.cue{font-size:13px;color:var(--slate);margin:8px 0 0;line-height:1.5}

/* set ladder */
.bar-line{height:2px;background:var(--paper-3);margin:14px 0 -9px}
.sets{display:flex;flex-direction:column;gap:8px;margin-top:0}
.set{
  display:flex;align-items:center;gap:8px;
  background:var(--paper-2);border-radius:2px;padding:8px;
}
.set.done{background:var(--orange-pale)}
.set-n{
  font-family:var(--mono);font-size:12px;font-weight:600;color:var(--slate);
  width:20px;flex:0 0 20px;text-align:center;
}
.set.done .set-n{color:var(--orange-deep)}
.field{display:flex;align-items:center;background:var(--paper);border-radius:2px;border:1px solid var(--rule)}
.field.grow{flex:1;min-width:0}
.step{width:34px;height:38px;font-size:19px;color:var(--slate);font-weight:600;line-height:1}
.step:active{color:var(--orange)}
.field input{
  width:100%;min-width:0;border:0;background:none;text-align:center;
  font-family:var(--mono);font-weight:600;font-size:16px;padding:0;
  border-radius:0;-webkit-appearance:none;
  -moz-appearance:textfield;
}
.field input::-webkit-outer-spin-button,.field input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.unit{font-family:var(--mono);font-size:11px;color:var(--slate);padding-right:8px}
.tick-btn{
  width:44px;height:40px;flex:0 0 44px;border-radius:2px;
  background:var(--paper);border:1px solid var(--rule);
  display:flex;align-items:center;justify-content:center;
}
.tick-btn::after{content:"";width:7px;height:13px;border:solid var(--paper-3);border-width:0 2px 2px 0;transform:rotate(45deg);margin-top:-3px}
.set.done .tick-btn{background:var(--orange);border-color:var(--orange)}
.set.done .tick-btn::after{border-color:#FFFFFF}
.pair-flag{
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--orange-deep);background:var(--orange-pale);
  padding:4px 8px;border-radius:2px;display:inline-block;margin-bottom:10px;
}

/* ---------- rest timer ---------- */
.rest{
  position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom));z-index:45;
  background:var(--orange);color:#FFFFFF;
}
.rest-in{
  max-width:560px;margin:0 auto;padding:11px 14px;
  display:flex;align-items:center;gap:12px;
}
.rest-t{font-family:var(--mono);font-weight:600;font-size:22px;letter-spacing:.02em}
.rest-l{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;flex:1}
.rest button{
  color:#FFFFFF;font-family:var(--mono);font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;border:1px solid #FFFFFF;padding:6px 9px;border-radius:2px;
}

/* ---------- nav ---------- */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:var(--iron-2);border-top:1px solid var(--iron-line);
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-in{max-width:560px;margin:0 auto;display:flex}
.nav button{
  flex:1;padding:12px 4px 13px;color:#9A9384;
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;
  border-top:2px solid var(--iron-2);
}
.nav button.on{color:var(--orange);border-top-color:var(--orange)}
.nav .g{display:block;font-family:var(--display);font-size:20px;line-height:1;margin-bottom:3px;font-weight:700}

/* ---------- progress ---------- */
.exrow{padding:13px 0;border-bottom:1px solid var(--paper-2)}
.exrow:last-child{border-bottom:0}
.exrow-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.exrow-name{font-family:var(--display);font-size:20px;font-weight:700;line-height:1.1}
.exrow-n{font-family:var(--mono);font-size:13px;font-weight:600;white-space:nowrap}
.exrow-sub{font-family:var(--mono);font-size:11px;color:var(--slate);margin-top:3px}
.spark{display:block;margin-top:8px}
.delta-up{color:var(--green)}
.delta-flat{color:var(--slate)}
.delta-down{color:var(--orange-deep)}

.libslot{padding:14px 0;border-bottom:1px solid var(--paper-2)}
.libslot:last-child{border-bottom:0}
.libslot h3{font-family:var(--display);font-size:19px;font-weight:700;margin:0 0 6px}
.libslot ul{list-style:none;margin:0;padding:0}
.libslot li{
  font-size:13px;padding:6px 0 6px 16px;position:relative;color:var(--slate);
  border-bottom:1px solid var(--paper-2);cursor:pointer;
}
.libslot li .cue{margin:6px 0 0}
.libslot li:last-child{border-bottom:0}
.libslot li.cur{color:var(--ink);font-weight:600}
.libslot li.cur::before{content:"";position:absolute;left:0;top:12px;width:8px;height:8px;background:var(--orange);border-radius:1px}

.cad{display:flex;gap:3px;margin:14px 0 5px}
.cad i{flex:1;height:32px;background:var(--paper-2);border-radius:1px;display:block}
.cad i.on{background:var(--orange)}
.cad i.open{background:var(--paper);border:2px solid var(--orange)}
.cad i.today{border-bottom:3px solid var(--ink)}
.cad-l{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--slate)}
.cad button{flex:1;height:32px;background:var(--paper-2);border-radius:1px;display:block;padding:0;
  border:0;cursor:pointer;transition:transform .08s ease}
.cad button.on{background:var(--orange)}
.cad button.open{background:var(--paper);border:2px solid var(--orange)}
.cad button.today{border-bottom:3px solid var(--ink)}
.cad button:active{transform:translateY(2px)}

.numlink{font-family:var(--mono);font-weight:600;font-size:19px;line-height:1.1;padding:0;
  color:var(--orange-deep);border-bottom:1px solid var(--orange-deep);display:inline-block}
.numlink:active{opacity:.6}

.histrow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:11px 0;border-bottom:1px solid var(--paper-2);color:var(--ink)}
.histrow:last-of-type{border-bottom:0}
.histrow b{display:block;font-family:var(--display);font-size:19px;font-weight:700;line-height:1.15}
.histrow span span{font-family:var(--mono);font-size:11px;color:var(--slate)}
.histrow .chev-r{font-size:22px;color:var(--rule);line-height:1}
.histrow:active{opacity:.6}
.tag-open{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--slate);vertical-align:2px}
.tick-btn.rm{font-size:20px;color:var(--slate);line-height:1}
.tick-btn.rm::after{display:none}
.tick-btn.rm:active{background:var(--orange-pale);color:var(--orange-deep)}

.setting{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--paper-2)}
.setting:last-of-type{border-bottom:0}
.setting label{font-size:14px;font-weight:500}
.setting .hint{font-size:12px;color:var(--slate);display:block;font-weight:400;margin-top:2px}
.tiles{display:flex;gap:11px}
.tile-big{
  flex:1;min-width:0;border-radius:16px;padding:15px 13px;min-height:136px;
  display:flex;flex-direction:column;justify-content:space-between;text-align:left;
  transition:transform .08s ease;
}
.tile-big:active{transform:translateY(2px)}
.tile-w{background:var(--orange);color:#FFFFFF}
.tile-a{background:var(--paper);border:2px solid var(--orange);color:var(--ink)}
.tile-big .tile-top{display:flex;align-items:flex-start;justify-content:space-between;width:100%}
.tile-big .t{font-size:17px;font-weight:600;line-height:1.2;letter-spacing:-.01em;display:block}
.tile-big .s{font-family:var(--mono);font-size:11px;margin-top:5px;display:block}
.tile-w .s{color:var(--orange-pale)}
.tile-a .s{color:var(--slate)}

.add-big{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--orange);color:#FFFFFF;border-radius:16px;padding:19px 17px;
  font-size:17px;font-weight:600;letter-spacing:-.01em;
  transition:transform .08s ease;
}
.add-big:active{transform:translateY(2px)}
.add-big.on{background:var(--paper-2);color:var(--ink);border:1px solid var(--rule)}
.opt.used{background:var(--orange-pale);color:var(--orange-deep)}

.opt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px}
.opt{background:var(--paper-2);border-radius:13px;padding:13px 5px;text-align:center;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;gap:5px}
.opt.on{background:var(--orange);color:#FFFFFF}
.opt.newx{background:var(--paper);border:1px dashed var(--rule);color:var(--slate)}
.opt b{font-size:11px;font-weight:500;line-height:1.25;display:block}

.ex-icon{width:34px;height:34px;flex:0 0 34px;background:var(--paper-2);border-radius:10px;
  display:flex;align-items:center;justify-content:center;color:var(--ink);margin-top:2px}
.ex-icon.lead{background:var(--orange);color:#FFFFFF}

.tile{
  width:46px;height:46px;flex:0 0 46px;background:var(--orange);
  border-radius:12px;display:flex;align-items:center;justify-content:center;
}
button.tile:active{transform:translateY(2px)}
.tile svg{width:22px;height:22px;display:block}
.card-head{display:flex;gap:13px;align-items:center;margin-bottom:8px}
.card-head .eyebrow{margin:0 0 2px}
.pick-row{display:flex;gap:10px;align-items:center}
.pick-row .pick{flex:1;min-width:0;margin-bottom:0}

.pick{
  width:100%;padding:13px;border:1px solid var(--rule);border-radius:2px;
  background:var(--paper);font-size:14px;margin-bottom:10px;color:var(--ink);
}
.seg{display:flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.seg button{padding:8px 14px;font-family:var(--mono);font-size:12px;color:var(--slate)}
.seg button.on{background:var(--orange);color:#FFFFFF}

.focus-note{
  border-left:3px solid var(--orange);padding-left:12px;margin:0;
  font-family:var(--display);font-style:italic;font-size:19px;line-height:1.35;
}
.warn{background:var(--orange-pale);color:var(--orange-deep);padding:10px 12px;border-radius:2px;font-size:13px;margin:14px 0}
.empty{text-align:center;padding:26px 12px;color:var(--slate);font-size:14px}
.pb{font-family:var(--mono);font-size:11px;color:var(--green);letter-spacing:.06em;text-transform:uppercase}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="gate" id="gate" hidden>
  <div class="gate-card">

function allExtras(){ return EXTRAS.concat(S.custom || []); }

/* resolve any exercise id — programme or extra */
function findEx(exId){
  for(const k in SLOTS){
    const f = SLOTS[k].pool.find(x => x.id === exId);
    if(f) return {ex:f, label:SLOTS[k].label, track:"load", slot:k};
  }
  const e = allExtras().find(x => x.id === exId);
  if(e) return {ex:e, label:e.cat, track:e.track};
  return null;
}

/* ============================================================
   MOVEMENT DIAGRAMS
   A small side-on stick figure. Each pose is eight points:
   Head, Neck, Elbow, Wrist, Pelvis, Knee, Ankle, Toe.
   ============================================================ */
const mk = (H,N,E,W,P,K,A,T) => ({H:H,N:N,E:E,W:W,P:P,K:K,A:A,T:T});
function L(a,b){return '<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'"/>';}
function fig(p){
  return '<g class="dfig"><circle cx="'+p.H[0]+'" cy="'+p.H[1]+'" r="10"/>' +
    L(p.H,p.N)+L(p.N,p.P)+L(p.N,p.E)+L(p.E,p.W)+L(p.P,p.K)+L(p.K,p.A)+L(p.A,p.T)+'</g>';
}
function limb(pts){return '<polyline class="dfig" points="'+pts.map(p=>p[0]+','+p[1]).join(" ")+'"/>';}
function plate(x,y,r){return '<circle class="dkit" cx="'+x+'" cy="'+y+'" r="'+(r||15)+'"/>';}
function dbell(x,y){return '<g class="dkit"><rect x="'+(x-3)+'" y="'+(y-5)+'" width="6" height="10"/>' +
  '<rect x="'+(x-9)+'" y="'+(y-10)+'" width="18" height="5" rx="2"/>' +
  '<rect x="'+(x-9)+'" y="'+(y+5)+'" width="18" height="5" rx="2"/></g>';}
function prop(pts){return '<polyline class="dprop" points="'+pts.map(p=>p[0]+','+p[1]).join(" ")+'"/>';}
function cable(a,b){return '<polyline class="dcable" points="'+a[0]+','+a[1]+' '+b[0]+','+b[1]+'"/>';}
function stack(x,top){return prop([[x-11,top],[x-11,186],[x+11,186],[x+11,top],[x-11,top]]);}
const GRD = '<line class="dground" x1="8" y1="186" x2="192" y2="186"/>';
const RACK = prop([[26,186],[26,16],[174,16],[174,186]]);
function benchFlat(x1,x2,y){return prop([[x1,y],[x2,y]]) + prop([[x1+9,y],[x1+9,186]]) + prop([[x2-9,y],[x2-9,186]]);}

/* ============================================================
   STATE
   ============================================================ */
const KEY = "ironwork:v1";
let S = null;
let tab = "train";
let storageOK = true;
let restTimer = null, restLeft = 0, restLabel = "";

function blankState(){
  return {
    v:1, units:"kg", bar:20,
    sessionIndex:0,
    nudge:{},          // slotId -> manual variant offset
    custom:[],         // exercises you have added yourself
    history:[],        // completed sessions
    current:null       // in-flight session
  };
}

let UID = null, ACCOUNT = {}, cloudOK = true, cloudPending = false;

function userKey(){ return UID ? KEY + ":" + UID : KEY; }

function pickNewer(a, b){
  if(!a) return b;
  if(!b) return a;
  return (b.updatedAt || 0) > (a.updatedAt || 0) ? b : a;
}

function readLocal(k){
  try{ const raw = localStorage.getItem(k); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}

async function loadState(){
  const local = readLocal(userKey());
  let cloud = null;
  if(window.__cloud && UID){
    try{ cloud = await window.__cloud.get(UID); cloudOK = true; }
    catch(e){ cloudOK = false; }
  }

  S = pickNewer(local, cloud);

  /* first sign-in on a device that already has anonymous history: adopt it */
  if(!S){
    const legacy = readLocal(KEY);
    if(legacy && legacy.history && legacy.history.length){
      S = legacy;
      S.updatedAt = Date.now();
    }
  }
  if(!S || !S.v) S = blankState();
  if(!S.custom) S.custom = [];

  try{ localStorage.setItem(userKey() + ":probe", "1"); localStorage.removeItem(userKey() + ":probe"); }
  catch(e){ storageOK = false; }

  /* if the cloud was empty or behind, push what we have up */
  if(UID && window.__cloud && (!cloud || (S.updatedAt || 0) > (cloud.updatedAt || 0))) pushCloud();
}

let cloudTimer = null;
function pushCloud(){
  if(!UID || !window.__cloud) return;
  clearTimeout(cloudTimer);
  cloudPending = true;
  cloudTimer = setTimeout(async ()=>{
    try{
      await window.__cloud.set(UID, S);
      cloudPending = false;
      if(!cloudOK){ cloudOK = true; render(); }
    }catch(e){
      cloudPending = false;
      if(cloudOK){ cloudOK = false; render(); }
    }
  }, 1200);
}

let saveQueued = false;
function save(){
  S.updatedAt = Date.now();
  if(!saveQueued){
    saveQueued = true;
    setTimeout(()=>{
      saveQueued = false;
      try{ localStorage.setItem(userKey(), JSON.stringify(S)); }
      catch(e){ if(storageOK){ storageOK = false; render(); } }
    }, 120);
  }
  pushCloud();
}

function sessionAt(i){ return SESSIONS[i % 3]; }
function cycleAt(i){ return Math.floor(i / 3); }

function variantFor(slotId, sessionIndex){
  const pool = SLOTS[slotId].pool;
  const auto = Math.floor(cycleAt(sessionIndex) / ROTATE_EVERY);
  const manual = S.nudge[slotId] || 0;
  return pool[(auto + manual) % pool.length];
}

function isNewVariant(slotId, sessionIndex){
  if(sessionIndex < 3) return false;
  return variantFor(slotId, sessionIndex).id !== variantFor(slotId, sessionIndex - 3).id;
}

function isDeload(i){ return i > 0 && i % DELOAD_EVERY === (DELOAD_EVERY - 1); }

function step(kind){
  if(S.units === "lb") return kind === "dumbbell" ? 5 : 2.5;
  return kind === "dumbbell" ? 1 : 1.25;
}
function incFor(ex){
  return S.units === "lb" ? Math.round(ex.inc * 2.2 / 2.5) * 2.5 : ex.inc;
}
function roundLoad(w, ex){
  const st = step(ex.kind);
  return Math.round(w / st) * st;
}
function fmt(n){
  if(n === null || n === undefined || isNaN(n)) return "—";
  return (Math.round(n * 100) / 100).toString();
}

/* last completed performance of a given exercise id */
function lastPerf(exId){
  for(let i = S.history.length - 1; i >= 0; i--){
    const e = S.history[i].entries.find(x => x.exId === exId && x.sets.some(s => s.done));
    if(e) return {entry:e, session:S.history[i]};
  }
  return null;
}
function topWeight(sets){ return sets.reduce((m,s)=> Math.max(m, s.w), 0); }

/* a true one-rep max only counts if a single was actually completed */
function trueSingle(sets){
  const singles = sets.filter(s => s.r === 1);
  return singles.length ? singles.reduce((m,s)=> Math.max(m, s.w), 0) : null;
}

function allPerf(exId){
  const out = [];
  S.history.forEach(h=>{
    const e = h.entries.find(x => x.exId === exId && x.sets.some(s => s.done));
    if(e){
      const done = e.sets.filter(s=>s.done);
      out.push({
        date:h.date,
        sets:done,
        top: topWeight(done),
        single: trueSingle(done),
        vol: done.reduce((m,s)=> m + s.w * s.r, 0)
      });
    }
  });
  return out;
}

/* has this exercise ever been taken to a genuine single? */
function anySingle(hist){ return hist.some(x => x.single !== null); }

/* the learning bit: what should today's load be? */
function suggest(ex, item, sessionIndex){
  const hist = allPerf(ex.id);
  if(!hist.length) return {w:null, why:"First time on this lift — find a load you could stop 2 reps short of."};

  const last = hist[hist.length - 1];
  const doneSets = last.sets;
  const allTop = doneSets.length >= item.sets && doneSets.every(s => s.r >= item.hi);
  const anyLow = doneSets.some(s => s.r < item.lo);
  const w = doneSets[doneSets.length - 1].w;

  let prevLow = false;
  if(hist.length > 1){
    prevLow = hist[hist.length - 2].sets.some(s => s.r < item.lo);
  }

  let out, why;
  if(allTop){
    out = roundLoad(w + incFor(ex), ex);
    why = "Top of the range on every set last time — load goes up.";
  }else if(anyLow && prevLow){
    out = roundLoad(w * 0.9, ex);
    why = "Two sessions under the range — backing off 10% to rebuild.";
  }else if(anyLow){
    out = w;
    why = "Same load. Get every set into the range before adding weight.";
  }else{
    out = w;
    why = "Same load. Chase reps until all sets hit " + item.hi + ".";
  }

  if(isDeload(sessionIndex)){
    out = roundLoad(out * 0.85, ex);
    why = "Deload session — 85% of your working load, moved fast and clean.";
  }
  return {w:out, why:why};
}

function estimateMinutes(sess){
  let secs = 0;
  sess.blocks.forEach(b=>{
    const work = b.items.length * 45;
    const sets = b.items[0].sets;
    secs += sets * (work + b.rest);
  });
  return Math.round(secs / 60);
}

/* ============================================================
   SESSION LIFECYCLE
   ============================================================ */
function startSession(){
  const i = S.sessionIndex;
  const sess = sessionAt(i);
  const entries = [];
  sess.blocks.forEach((b, bi)=>{
    b.items.forEach(item=>{
      const ex = variantFor(item.slot, i);
      const sug = suggest(ex, item, i);
      const lp = lastPerf(ex.id);
      const prefillR = lp ? lp.entry.sets.filter(s=>s.done).slice(-1)[0].r : item.hi;
      entries.push({
        block:bi, slot:item.slot, exId:ex.id, track:"load",
        sets:Array.from({length:item.sets}, ()=>({
          w: sug.w === null ? "" : sug.w,
          r: prefillR,
          done:false
        }))
      });
    });
  });
  S.current = {index:i, key:sess.key, startedAt:Date.now(), entries:entries};
  addOpen = false;
  save(); render();
}

function startOpen(){
  S.current = {index:S.sessionIndex, key:"X", open:true, startedAt:Date.now(), entries:[]};
  addOpen = false;
  save(); render();
}

function finishSession(){
  const c = S.current;
  const done = c.entries.reduce((n,e)=> n + e.sets.filter(s=>s.done).length, 0);
  if(done === 0){
    if(!confirm("No sets logged. Discard this session?")) return;
    S.current = null; save(); render(); return;
  }
  const rec = {
    date: new Date().toISOString(),
    key: c.key, index: c.index, open: !!c.open,
    title: c.open ? (c.entries[0] ? (c.entries[0].name || "Open session") : "Open session") : null,
    minutes: Math.round((Date.now() - c.startedAt) / 60000),
    entries: c.entries.map(e=>({
      slot:e.slot, exId:e.exId, track:e.track || "load", extra:!!e.extra, name:e.name,
      sets:e.sets.filter(s=>s.done).map(s=>({w:Number(s.w)||0, r:Number(s.r)||0, done:true}))
    })).filter(e=>e.sets.length)
  };
  S.history.push(rec);
  addOpen = false;
  if(!c.open) S.sessionIndex = c.index + 1;
  S.current = null;
  save();
  tab = "train";
  render();
  showSummary(rec);
}

let summaryRec = null;
function showSummary(rec){ summaryRec = rec; render(); }

/* ============================================================
   REST TIMER
   ============================================================ */
function beep(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const c = new Ctx();
    const o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination);
    o.frequency.value = 660; g.gain.value = 0.06;
    o.start(); o.stop(c.currentTime + 0.18);
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate(200);
}
function startRest(secs, label){
  clearInterval(restTimer);
  restLeft = secs; restLabel = label;
  drawRest();
  restTimer = setInterval(()=>{
    restLeft--;
    if(restLeft <= 0){ clearInterval(restTimer); restTimer = null; beep(); }
    drawRest();
  }, 1000);
}
function stopRest(){ clearInterval(restTimer); restTimer = null; restLeft = 0; drawRest(); }
function drawRest(){
  const host = document.getElementById("restHost");
  if(!restTimer && restLeft <= 0){ host.innerHTML = ""; return; }
  const m = Math.floor(restLeft / 60), s = restLeft % 60;
  host.innerHTML =
    '<div class="rest"><div class="rest-in">' +
      '<span class="rest-t">' + m + ":" + String(s).padStart(2, "0") + '</span>' +
      '<span class="rest-l">' + restLabel + '</span>' +
      '<button data-rest="add">+30s</button>' +
      '<button data-rest="skip">Skip</button>' +
    '</div></div>';
}

/* ============================================================
   RENDER
   ============================================================ */
const esc = t => String(t).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  document.getElementById("mastSub").textContent =
    !cloudOK ? "Offline" : S.current ? "Session in progress" : "Session " + (S.sessionIndex + 1);
  document.querySelectorAll(".nav button").forEach(b=>{
    b.classList.toggle("on", b.dataset.tab === tab);
  });
  const v = document.getElementById("view");
  if(summaryRec){ v.innerHTML = viewSummary(); return; }
  if(tab === "train"){
    v.innerHTML = S.current ? viewSession()
      : histIdx !== null ? viewHistory()
      : histList ? viewHistList()
      : previewOpen ? viewPreview()
      : pick.open ? viewPicker()
      : viewHome();
  }
  if(tab === "progress") v.innerHTML = viewProgress();
  if(tab === "library")  v.innerHTML = viewLibrary();
  if(tab === "settings") v.innerHTML = viewSettings();
}

function storageWarn(){
  return storageOK ? "" : '<div class="warn">This browser is refusing to save. Nothing logged now will be remembered — check that you are not in private browsing, and that site data is allowed for this domain.</div>';
}

/* ---------- home dashboard helpers ---------- */
function dayKey(d){ return new Date(d).toISOString().slice(0, 10); }

function cadence(days){
  const trained = {};
  S.history.forEach(h=>{
    const k = dayKey(h.date);
    if(!trained[k]) trained[k] = {s:false, o:false};
    if(h.open) trained[k].o = true; else trained[k].s = true;
  });
  const out = [];
  for(let i = days - 1; i >= 0; i--){
    const d = new Date(Date.now() - i * 86400000);
    const k = dayKey(d);
    out.push({key:k, s:trained[k] ? trained[k].s : false, o:trained[k] ? trained[k].o : false, today:i === 0});
  }
  return out;
}

function slotPerf(slotId){
  const out = [];
  S.history.forEach(h=>{
    const e = h.entries.find(x => x.slot === slotId && (x.track || "load") === "load");
    if(e && e.sets.length){
      out.push({date:h.date, exId:e.exId, top:topWeight(e.sets), single:trueSingle(e.sets)});
    }
  });
  return out;
}

function extrasTally(){
  let km = 0, mins = 0, count = 0;
  S.history.forEach(h => h.entries.forEach(e=>{
    const tr = e.track || "load";
    if(tr === "distance"){ km += e.sets.reduce((n,s)=> n + s.w, 0); mins += e.sets.reduce((n,s)=> n + s.r, 0); count++; }
    if(tr === "time"){ mins += e.sets.reduce((n,s)=> n + s.w, 0); count++; }
  }));
  return {km:km, mins:mins, count:count};
}

      (last28 >= 13 ? "Bang on the every-other-day cadence."
       : last28 >= 9 ? "Close to cadence. One more session a fortnight closes the gap."
       : last28 >= 4 ? "Below the every-other-day target. Consistency beats intensity here."
       : strength.length ? "Sparse fortnight. Getting back to a fixed rhythm matters more than the loads."
       : "Nothing logged yet — the strip fills in as you train.") +
      (open28 ? " Plus " + open28 + " open session" + (open28 > 1 ? "s" : "") + "." : "") + '</p>' +
    '<div class="cad">' + cad.map(d=>{
      const cls = (d.s ? "on " : d.o ? "open " : "") + (d.today ? "today" : "");
      return (d.s || d.o)
        ? '<button class="' + cls + '" data-day="' + d.key + '" title="' + d.key + ' — tap to open" aria-label="Sessions on ' + d.key + '"></button>'
        : '<i class="' + cls + '" title="' + d.key + '"></i>';
    }).join("") + '</div>' +
    '<div class="cad-l"><span>28 days ago</span><span>Today</span></div>' +
    '<p class="lede" style="font-size:12px;margin-top:8px">Solid bars are programme sessions, outlined are open ones. Tap any bar to review or correct that session.</p>' +
    '<div class="meta">' +
      '<div><button class="n numlink" data-act="histList">' + strength.length + '</button><span class="l">Programme</span></div>' +
      '<div><span class="n">' + totalMins + '</span><span class="l">Minutes</span></div>' +
      '<div><span class="n">' + totalSets + '</span><span class="l">Sets</span></div>' +
    '</div>' +
  '</div></div>';

  /* ---- movement on the three primaries ---- */
  if(S.history.length){
    const primaries = [["squat","Squat"],["deadlift","Hinge"],["vpullHeavy","Pull"]];
    let rows = "";
    primaries.forEach(pair=>{
      const perf = slotPerf(pair[0]);
      const cur = variantFor(pair[0], i);
      if(!perf.length){
        rows += '<div class="exrow"><div class="exrow-top">' +
          '<span class="exrow-name">' + esc(pair[1]) + '</span>' +
          '<span class="exrow-n" style="color:var(--slate)">—</span></div>' +
          '<div class="exrow-sub">' + esc(cur.name) + ' · not logged yet</div></div>';
        return;
      }
      const latest = perf[perf.length - 1], first = perf[0];
      const hasSingle = perf.some(x => x.single !== null);
      const curV = hasSingle ? latest.single : latest.top;
      const firstV = hasSingle ? (first.single !== null ? first.single : first.top) : first.top;
      const d = curV - firstV;
      const cls = d > 0.5 ? "delta-up" : d < -0.5 ? "delta-down" : "delta-flat";
      const lf = findEx(latest.exId);
      rows += '<div class="exrow">' +
        '<div class="exrow-top">' +
          '<span class="exrow-name">' + esc(pair[1]) + '</span>' +
          '<span class="exrow-n">' + fmt(curV) + ' ' + S.units + '</span>' +
        '</div>' +
        '<div class="exrow-sub">' + esc(lf ? lf.ex.name : "") + ' · ' + (hasSingle ? "one-rep max" : "heaviest set") +
          ' · ' + perf.length + ' logged · ' +
          '<span class="' + cls + '">' + (d > 0 ? "+" : "") + fmt(d) + ' ' + S.units + ' since you started</span></div>' +
        sparkline(perf.map(x => (hasSingle && x.single !== null) ? x.single : x.top)) +
      '</div>';
    });
    html += '<div class="panel"><div class="pad">' +
      '<p class="eyebrow">Movement on the main patterns</p>' +
      '<p class="lede" style="margin-bottom:6px">Heaviest set, tracked across whichever variation is loaded. Take a lift to a true single and it switches to a one-rep max.</p>' +
      rows +
      '<div style="margin-top:14px"><button class="btn btn-ghost" data-tab="progress">See every exercise</button></div>' +
    '</div></div>';
  }

  /* ---- everything else you have logged ---- */
  const tally = extrasTally();
  if(tally.count){
    html += '<div class="panel"><div class="pad">' +
      '<p class="eyebrow">Everything else</p>' +
      '<div class="meta" style="border-top:0;margin-top:0">' +
        '<div><span class="n">' + fmt(Math.round(tally.km * 10) / 10) + '</span><span class="l">km covered</span></div>' +
        '<div><span class="n">' + fmt(Math.round(tally.mins)) + '</span><span class="l">min added work</span></div>' +
        '<div><span class="n">' + tally.count + '</span><span class="l">entries</span></div>' +
      '</div>' +
    '</div></div>';
  }

  /* ---- first run ---- */
  if(!S.history.length){
    html += '<div class="panel"><div class="pad">' +
      '<h2 class="head">How this runs</h2>' +
      '<p class="lede" style="margin-top:8px">Three full-body sessions — Drive, Root, Reach — on rotation, every other day. Each one covers a squat, a hinge, a push, a pull and trunk work, so nothing is neglected across a week.</p>' +
      '<hr class="rule">' +
      '<p class="lede">Log the weight and reps for every set you complete. Next time the app reads what you did and sets the target: hit the top of the rep range on all sets and the load goes up; fall short twice and it backs off 10%. After four cycles every movement swaps to a new variant of the same pattern, so the training stays comparable but never repeats.</p>' +
    '</div></div>';
  }else{
    html += '<div class="panel"><div class="pad">' +
      '<p class="eyebrow">Standing total</p>' +
      '<p style="font-family:var(--mono);font-size:13px;margin:0;color:var(--slate)">' +
        Math.round(totalVol).toLocaleString("en-GB") + ' ' + S.units + ' moved across ' + totalSets + ' sets</p>' +
    '</div></div>';
  }

  return html;
}

const EXTRA_ICON = {
  "x-run":"run","x-cycle":"bike","x-row-erg":"row","x-swim":"swim","x-walk":"walk","x-skip":"skip",
  "x-intervals":"bolt","x-hill":"mountain","x-shuttle":"bolt","x-stairs":"stairs",
  "x-burpee":"bolt","x-mtn":"bolt","x-bw-circuit":"clock","x-battle":"bolt",
  "x-calf":"dumbbell","x-shrug":"barbell","x-lateral":"dumbbell","x-facepull":"cable","x-rear-fly":"dumbbell",
  "x-deadhang":"pullbar","x-plank":"core","x-side-plank":"core",
  "x-mobility":"stretch","x-hip-flow":"stretch","x-thoracic":"stretch","x-stretch":"stretch","x-yoga":"yoga"
};
const SLOT_ICON = {vpull:"pullbar", vpullHeavy:"pullbar", antirot:"core", antiext:"core"};

function iconFor(exId){
  if(EXTRA_ICON[exId]) return EXTRA_ICON[exId];
  const f = findEx(exId);
  if(!f) return "clock";
  if(f.slot && SLOT_ICON[f.slot]) return SLOT_ICON[f.slot];
  if(f.track === "distance") return "run";
  if(f.track === "time") return "clock";
  const k = f.ex.kind;
  return k === "barbell" ? "barbell" : k === "cable" ? "cable" : k === "bodyweight" ? "pullbar" : "dumbbell";
}

      ).join("") + '</optgroup>').join("");

function addExtraToSession(exId){
  if(!S.current) return;
  if(S.current.entries.some(e => e.exId === exId)) return;
  const f = findEx(exId);
  if(!f) return;
  const tr = f.track;
  const cfg = TRACK[tr];
  const lp = lastPerf(exId);
  const seed = lp ? lp.entry.sets.filter(s=>s.done).slice(-1)[0] : null;
  S.current.entries.push({
    extra:true, exId:exId, name:f.ex.name, track:tr,
    sets:[{w: seed ? seed.w : cfg.aDef, r: seed ? seed.r : cfg.bDef, done:false}]
  });
  save(); render();
}

/* ---------- set rows, adapted to what is being tracked ---------- */
function setRows(entry, rest){
  const tr = entry.track || "load";
  const cfg = TRACK[tr];
  const aUnit = cfg.a(), bUnit = cfg.b;
  let out = "";
  entry.sets.forEach((st, si)=>{
    const id = entry.exId + ":" + si;
    out += '<div class="set ' + (st.done ? "done" : "") + '">' +
      '<span class="set-n">' + (si + 1) + '</span>' +
      '<div class="field grow">' +
        '<button class="step" data-nudge="w:-1:' + id + '" aria-label="Less">−</button>' +
        '<input type="number" inputmode="decimal" data-in="w:' + id + '" value="' + st.w + '" aria-label="' + aUnit + ' for set ' + (si+1) + '">' +
        '<span class="unit">' + aUnit + '</span>' +
        '<button class="step" data-nudge="w:1:' + id + '" aria-label="More">+</button>' +
      '</div>' +
      '<div class="field" style="width:116px">' +
        '<button class="step" data-nudge="r:-1:' + id + '" aria-label="Less">−</button>' +
        '<input type="number" inputmode="decimal" data-in="r:' + id + '" value="' + st.r + '" aria-label="' + bUnit + ' for set ' + (si+1) + '">' +
        '<span class="unit">' + bUnit + '</span>' +
        '<button class="step" data-nudge="r:1:' + id + '" aria-label="More">+</button>' +
      '</div>' +
      '<button class="tick-btn" data-done="' + id + ':' + rest + '" aria-label="Mark set ' + (si+1) + ' complete"></button>' +
    '</div>';
  });
  return out;
}

function viewSession(){

  if(c.open) return viewOpen();
  const sess = sessionAt(c.index);
  let html = storageWarn() +
    '<div class="panel"><div class="pad">' +
      '<p class="eyebrow">Session ' + (c.index + 1) + ' · ' + esc(sess.focus) + '</p>' +
      '<h1 class="session-title">' + esc(sess.title) + '</h1>' +
      '<p class="focus-note" style="margin-top:12px">' + esc(FOCUS_CUES[c.index % FOCUS_CUES.length]) + '</p>' +
    '</div></div>';


  /* blocks */
  sess.blocks.forEach((b, bi)=>{
    const inBlock = c.entries.filter(e => e.block === bi);
    html += '<div class="panel"><div class="pad">';
    if(b.items.length > 1) html += '<span class="pair-flag">Superset — alternate, rest ' + b.rest + 's after the pair</span>';
    else html += '<span class="pair-flag">Rest ' + b.rest + 's between sets</span>';

    inBlock.forEach(entry=>{
      const item = b.items.find(x => x.slot === entry.slot);
      const ex = SLOTS[entry.slot].pool.find(x => x.id === entry.exId);

      const lp = lastPerf(ex.id);
      const ghost = lp
        ? "Last: " + fmt(lp.entry.sets.filter(s=>s.done)[0].w) + " " + S.units + " × " +
          lp.entry.sets.filter(s=>s.done).map(s=>s.r).join(" · ")
        : "No history yet";

      html += '<div class="ex" style="padding-top:16px;margin-top:16px">' +
        '<div class="ex-head">' +
          '<span class="ex-icon' + (entry.block === 0 ? " lead" : "") + '">' + icon(iconFor(entry.exId), 19) + '</span>' +
          '<div style="flex:1;min-width:0">' +
          '<p class="ex-pattern">' + esc(SLOTS[entry.slot].label) + '</p>' +
          '<button class="ex-name" data-diag="' + entry.exId + '">' + esc(ex.name) +
            (isNewVariant(entry.slot, c.index) ? '<span class="tag-new">New</span>' : '') +
            '<span class="chev">' + infoIcon(!!openDiag[entry.exId]) + '</span></button>' +
        '</div><button class="mini" data-swap="' + entry.slot + '">Swap</button></div>' +
        '<p class="target"><b>' + item.sets + ' × ' + item.lo + '–' + item.hi +
          (ex.perSide ? " each side" : "") + '</b>' +
          '<span>' + (sug.w === null ? "load to find" : fmt(sug.w) + " " + S.units + (ex.kind === "dumbbell" ? " per hand" : ex.kind === "bodyweight" ? " added" : "")) + '</span></p>' +
        '<p class="ghost">' + esc(ghost) + '</p>' +
        '<p class="cue">' + esc(sug.why) + '</p>' +
        '<div class="bar-line"></div><div class="sets">';

      html += setRows(entry, b.rest);

      html += '</div><p class="cue">' + esc(ex.cue) + '</p>' +
        (openDiag[entry.exId] ? diagram(entry.exId) : "") + '</div>';
    });
    html += '</div></div>';
  });

  html += extrasPanel();
  html += finishPanel();
  return html;
}

/* ---------- summary ---------- */
function viewSummary(){
  const rec = summaryRec;
  const sess = SESSIONS.find(s => s.key === rec.key);
  const title = rec.open ? (rec.title || "Open session") : (sess ? sess.title : "Session");
  const sets = rec.entries.reduce((n,e)=> n + e.sets.length, 0);
  const vol = rec.entries.reduce((n,e)=> n + ((e.track||"load")==="load" ? e.sets.reduce((m,s)=> m + s.w * s.r, 0) : 0), 0);
  const cardio = rec.entries.filter(e => (e.track||"load") !== "load");

  let pbs = [];
  rec.entries.forEach(e=>{
    if((e.track||"load") !== "load") return;
    const f = findEx(e.exId);
    if(!f) return;
    const prev = allPerf(e.exId).slice(0, -1);
    const single = trueSingle(e.sets);
    if(single !== null){
      const priorSingle = prev.reduce((m,h)=> Math.max(m, h.single === null ? 0 : h.single), 0);
      if(single > priorSingle && priorSingle > 0)
        pbs.push(f.ex.name + " — one-rep max now " + fmt(single) + " " + S.units);
    }
    const best = topWeight(e.sets);
    const priorTop = prev.reduce((m,h)=> Math.max(m, h.top), 0);
    if(best > priorTop && priorTop > 0)
      pbs.push(f.ex.name + " — heaviest set now " + fmt(best) + " " + S.units);
  });

  const next = sessionAt(S.sessionIndex);
  return '<div class="panel"><div class="pad">' +
    '<p class="eyebrow">' + (rec.open ? "Logged · open session" : "Logged") + '</p>' +
    '<h1 class="session-title">' + esc(title) + '</h1>' +
    '<div class="meta">' +
      '<div><span class="n">' + rec.minutes + '<span style="font-size:12px">min</span></span><span class="l">Elapsed</span></div>' +
      '<div><span class="n">' + sets + '</span><span class="l">Sets</span></div>' +
      '<div><span class="n">' + Math.round(vol) + '</span><span class="l">Volume ' + S.units + '</span></div>' +
    '</div>' +
    (cardio.length ? '<hr class="rule"><p class="eyebrow">Also logged</p>' +
      cardio.map(e=>{
        const f = findEx(e.exId);
        const a = e.sets.reduce((n,s)=> n + s.w, 0);
        return '<p class="lede" style="margin-top:4px">' + esc(f ? f.ex.name : e.name || "Added work") +
          ' — ' + fmt(Math.round(a*10)/10) + ' ' + (e.track === "distance" ? "km" : "min") + '</p>';
      }).join("") : "") +
    (pbs.length ? '<hr class="rule"><p class="pb">Personal best</p>' +
      pbs.map(p=>'<p class="lede" style="margin-top:4px">' + esc(p) + '</p>').join("") : "") +
    '<hr class="rule">' +
    '<p class="lede">Next up is <b>' + esc(next.title) + '</b> — ' + esc(next.focus) + '. Leave a full day between sessions.</p>' +
    '<div style="margin-top:16px"><button class="btn btn-quiet" data-act="closeSummary">Done</button></div>' +
  '</div></div>';
}

/* ---------- progress ---------- */
function sparkline(vals){
  if(vals.length < 2) return "";
  const w = 240, h = 34, min = Math.min(...vals), max = Math.max(...vals);
  const span = (max - min) || 1;
  const pts = vals.map((v,i)=>
    (i / (vals.length - 1) * w).toFixed(1) + "," + (h - ((v - min) / span) * (h - 4) - 2).toFixed(1)
  ).join(" ");
  return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '" preserveAspectRatio="none" aria-hidden="true">' +
    '<polyline points="' + pts + '" fill="none" stroke="#FF6600" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}

function viewProgress(){
  if(!S.history.length){
    return '<div class="panel"><div class="pad"><p class="eyebrow">Progress</p>' +
      '<div class="empty">Nothing logged yet. Finish a session and your loads, estimated maxes and trends appear here.</div>' +
    '</div></div>';
  }
  const seen = [];
  S.history.forEach(h => h.entries.forEach(e => { if(!seen.includes(e.exId)) seen.push(e.exId); }));

  let rows = "";
  seen.forEach(exId=>{
    const f = findEx(exId);
    const hist = allPerf(exId);
    if(!hist.length) return;
    const name = f ? f.ex.name : "Removed exercise";
    const label = f ? f.label : "Added";
    const tr = f ? f.track : "load";
    const cur = hist[hist.length - 1], first = hist[0];

    let head, sub, series;
    if(tr === "load"){
      const hasSingle = anySingle(hist);
      const curV = hasSingle ? (cur.single !== null ? cur.single : cur.top) : cur.top;
      const firstV = hasSingle ? (first.single !== null ? first.single : first.top) : first.top;
      const d = curV - firstV;
      const cls = d > 0.5 ? "delta-up" : d < -0.5 ? "delta-down" : "delta-flat";
      const heavy = cur.sets.reduce((m,x)=> x.w > m.w ? x : m, cur.sets[0]);
      head = fmt(curV) + " " + S.units;
      sub = label + ' · ' + hist.length + ' session' + (hist.length > 1 ? "s" : "") +
        ' · best set ' + fmt(heavy.w) + ' × ' + heavy.r +
        ' · <span class="' + cls + '">' + (d > 0 ? "+" : "") + fmt(d) + ' ' + S.units +
        (hasSingle ? ' one-rep max' : ' heaviest set') + '</span>';
      series = hist.map(x => (hasSingle && x.single !== null) ? x.single : x.top);
    }else if(tr === "distance"){
      const dist = x => x.sets.reduce((n,s)=> n + s.w, 0);
      const mins = x => x.sets.reduce((n,s)=> n + s.r, 0);
      const total = hist.reduce((n,x)=> n + dist(x), 0);
      head = fmt(Math.round(dist(cur) * 10) / 10) + " km";
      sub = label + ' · ' + hist.length + ' session' + (hist.length > 1 ? "s" : "") +
        ' · last ' + fmt(Math.round(dist(cur)*10)/10) + ' km in ' + fmt(mins(cur)) + ' min' +
        ' · <span class="delta-flat">' + fmt(Math.round(total * 10) / 10) + ' km total</span>';
      series = hist.map(dist);
    }else{
      const mins = x => x.sets.reduce((n,s)=> n + s.w, 0);
      const total = hist.reduce((n,x)=> n + mins(x), 0);
      const effort = cur.sets.reduce((n,s)=> n + s.r, 0) / cur.sets.length;
      head = fmt(mins(cur)) + " min";
      sub = label + ' · ' + hist.length + ' session' + (hist.length > 1 ? "s" : "") +
        ' · last effort ' + fmt(Math.round(effort * 10) / 10) + '/10' +
        ' · <span class="delta-flat">' + fmt(total) + ' min total</span>';
      series = hist.map(mins);
    }

    rows += '<div class="exrow">' +
      '<div class="exrow-top">' +
        '<span class="exrow-name">' + esc(name) + '</span>' +
        '<span class="exrow-n">' + head + '</span>' +
      '</div>' +
      '<div class="exrow-sub">' + sub + '</div>' +
      sparkline(series) +
    '</div>';
  });

  const totalVol = S.history.reduce((n,h)=> n + h.entries.reduce((m,e)=> m + ((e.track||"load")==="load" ? e.sets.reduce((k,s)=> k + s.w*s.r, 0) : 0), 0), 0);
  const recent = S.history.slice(-8).reverse().map(h=>{
    const sess = SESSIONS.find(s => s.key === h.key);
    const label = h.open ? (h.title || "Open session") : (sess ? sess.title : "Session");
    const d = new Date(h.date);
    return '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--paper-2);font-size:13px">' +
      '<span>' + esc(label) + (h.open ? ' <span style="font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--slate)">open</span>' : "") + '</span>' +
      '<span style="font-family:var(--mono);font-size:12px;color:var(--slate)">' +
        d.toLocaleDateString("en-GB", {day:"numeric", month:"short"}) + ' · ' + h.minutes + ' min</span></div>';
  }).join("");

  return '<div class="panel"><div class="pad">' +
      '<p class="eyebrow">Standing</p>' +
      '<h2 class="head">' + S.history.length + ' sessions, ' + Math.round(totalVol).toLocaleString("en-GB") + ' ' + S.units + ' moved</h2>' +
      '<hr class="rule">' + recent +
    '</div></div>' +
    '<div class="panel"><div class="pad">' +
      '<p class="eyebrow">Every exercise logged</p>' + rows +
    '</div></div>';
}

/* ============================================================
   EVENTS
   ============================================================ */
function setVal(id, field, val){
  const [exId, si] = id.split(":");
  const e = S.current.entries.find(x => x.exId === exId);
  if(!e) return;
  e.sets[Number(si)][field] = val;
}

document.addEventListener("click", e=>{
  const t = e.target.closest("[data-tab],[data-act],[data-done],[data-nudge],[data-swap],[data-units],[data-bar],[data-rest],[data-diag],[data-rmx],[data-addset],[data-newtrack],[data-delcustom],[data-pick],[data-addpick],[data-day],[data-hopen],[data-hnudge],[data-haddset],[data-hrmset],[data-hrmex]");
  if(!t) return;

  if(t.dataset.diag){
    const id = t.dataset.diag;
    if(openDiag[id]) delete openDiag[id]; else openDiag[id] = true;
    render(); return;
  }

  if(t.dataset.tab){ summaryRec = null; histIdx = null; histList = false; histDay = null; previewOpen = false; tab = t.dataset.tab; render(); return; }

  if(t.dataset.rest){
    if(t.dataset.rest === "add"){ restLeft += 30; drawRest(); }
    else stopRest();
    return;
  }


  if(t.dataset.swap){
    const slot = t.dataset.swap;
    S.nudge[slot] = (S.nudge[slot] || 0) + 1;
    const ex = variantFor(slot, S.current.index);
    const entry = S.current.entries.find(x => x.slot === slot);
    const sess = sessionAt(S.current.index);
    const item = sess.blocks[entry.block].items.find(x => x.slot === slot);
    const sug = suggest(ex, item, S.current.index);
    entry.exId = ex.id;
    entry.sets = Array.from({length:item.sets}, ()=>({w: sug.w === null ? "" : sug.w, r:item.hi, done:false}));
    save(); render(); return;
  }

  if(t.dataset.nudge){
    const [field, dir, exId, si] = t.dataset.nudge.split(":");
    const entry = S.current.entries.find(x => x.exId === exId);
    const tr = entry.track || "load";
    const cfg = TRACK[tr];
    const set = entry.sets[Number(si)];
    if(field === "w"){
      let st = cfg.aStep;
      if(st === null){ const f = findEx(exId); st = step(f.ex.kind); }
      const cur = Number(set.w) || 0;
      set.w = Math.max(0, Math.round((cur + Number(dir) * st) / st) * st);
    }else{
      let v = (Number(set.r) || 0) + Number(dir) * cfg.bStep;
      if(cfg.bMax) v = Math.min(cfg.bMax, v);
      set.r = Math.max(0, v);
    }
    save(); render(); return;
  }

  if(t.dataset.rmx){
    const i = S.current.entries.findIndex(x => x.exId === t.dataset.rmx && x.extra);
    if(i >= 0) S.current.entries.splice(i, 1);
    save(); render(); return;
  }

  if(t.dataset.addset){
    const entry = S.current.entries.find(x => x.exId === t.dataset.addset);
    const last = entry.sets[entry.sets.length - 1];
    entry.sets.push({w:last ? last.w : TRACK[entry.track].aDef, r:last ? last.r : TRACK[entry.track].bDef, done:false});
    save(); render(); return;
  }

  if(t.dataset.delcustom){
    const id = t.dataset.delcustom;
    const ex = S.custom.find(x => x.id === id);
    if(ex && confirm('Remove "' + ex.name + '" from the dropdown? Sessions already logged keep their record.')){
      S.custom = S.custom.filter(x => x.id !== id);
      save(); render();
    }
    return;
  }

  if(t.dataset.addpick){
    addExtraToSession(t.dataset.addpick);
    addOpen = false; newExtra.open = false;
    render(); return;
  }

  if(t.dataset.pick){ pick.sel = (pick.sel === t.dataset.pick ? null : t.dataset.pick); render(); return; }

  if(t.dataset.day){
    const key = t.dataset.day;
    const hits = S.history.map((h,i)=>({h:h,i:i})).filter(r => dayKey(r.h.date) === key);
    if(!hits.length) return;
    if(hits.length === 1){ histIdx = hits[0].i; histList = false; }
    else { histDay = key; histList = true; histIdx = null; }
    previewOpen = false; render(); return;
  }

  if(t.dataset.hopen !== undefined){
    histIdx = Number(t.dataset.hopen); histList = false; render(); return;
  }

  if(t.dataset.hnudge){
    const [field, dir, ei, si] = t.dataset.hnudge.split(":");
    const entry = S.history[histIdx].entries[Number(ei)];
    const cfg = TRACK[entry.track || "load"];
    const set = entry.sets[Number(si)];
    if(field === "w"){
      let st = cfg.aStep;
      if(st === null){ const f = findEx(entry.exId); st = f ? step(f.ex.kind) : 2.5; }
      set.w = Math.max(0, Math.round(((Number(set.w)||0) + Number(dir)*st) / st) * st);
    }else{
      let v = (Number(set.r)||0) + Number(dir)*cfg.bStep;
      if(cfg.bMax) v = Math.min(cfg.bMax, v);
      set.r = Math.max(0, v);
    }
    save(); render(); return;
  }

  if(t.dataset.haddset){
    const entry = S.history[histIdx].entries[Number(t.dataset.haddset)];
    const last = entry.sets[entry.sets.length - 1];
    entry.sets.push({w: last ? last.w : 0, r: last ? last.r : 0, done:true});
    save(); render(); return;
  }

  if(t.dataset.hrmset){
    const [ei, si] = t.dataset.hrmset.split(":").map(Number);
    const entry = S.history[histIdx].entries[ei];
    entry.sets.splice(si, 1);
    if(!entry.sets.length) S.history[histIdx].entries.splice(ei, 1);
    if(!S.history[histIdx].entries.length){
      if(confirm("That was the last set in this session. Delete the session?")){
        S.history.splice(histIdx, 1); histIdx = null;
      }else{
        S.history[histIdx].entries.push(entry); entry.sets.push({w:0, r:0, done:true});
      }
    }
    save(); render(); return;
  }

  if(t.dataset.hrmex){
    const ei = Number(t.dataset.hrmex);
    const entry = S.history[histIdx].entries[ei];
    const f = findEx(entry.exId);
    if(confirm("Remove " + (entry.name || (f ? f.ex.name : "this exercise")) + " from this session?")){
      S.history[histIdx].entries.splice(ei, 1);
      if(!S.history[histIdx].entries.length){ S.history.splice(histIdx, 1); histIdx = null; }
      save(); render();
    }
    return;
  }

  if(t.dataset.newtrack){ newExtra.track = t.dataset.newtrack; render(); return; }

  if(t.dataset.done){
    const parts = t.dataset.done.split(":");
    const exId = parts[0], si = Number(parts[1]), rest = Number(parts[2]);
    const entry = S.current.entries.find(x => x.exId === exId);
    const set = entry.sets[si];
    set.done = !set.done;
    if(set.done){
      const ex = SLOTS[entry.slot].pool.find(x => x.id === exId);
      startRest(rest, "Rest · " + ex.name);
      /* carry the load forward to the remaining sets */
      for(let k = si + 1; k < entry.sets.length; k++){
        if(!entry.sets[k].done) entry.sets[k].w = set.w;
      }
    }
    save(); render(); return;
  }

  if(t.dataset.units){ S.units = t.dataset.units; save(); render(); return; }
  if(t.dataset.bar){ S.bar = Math.max(0, S.bar + Number(t.dataset.bar) * 2.5); save(); render(); return; }

  const act = t.dataset.act;
  if(act === "addExtra"){
    const sel = document.getElementById("extraPick");
    if(sel && sel.value) addExtraToSession(sel.value);
    return;
  }
  if(act === "toggleAdd"){ addOpen = !addOpen; newExtra.open = false; render(); return; }
  if(act === "openPicker"){ pick = {open:true, sel:null}; newExtra.open = false; render(); return; }
  if(act === "closePicker"){ pick = {open:false, sel:null}; newExtra.open = false; render(); return; }
  if(act === "startPicked"){
    const chosen = pick.sel;
    pick = {open:false, sel:null};
    startOpen();
    if(chosen) addExtraToSession(chosen);
    return;
  }
  if(act === "openNew"){ newExtra = {open:true, name:"", track:"time"}; render(); return; }
  if(act === "cancelNew"){ newExtra.open = false; render(); return; }
  if(act === "saveNew"){
    const name = (newExtra.name || "").trim();
    if(!name){ alert("Give the exercise a name first."); return; }
    const id = "c-" + name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + "-" + Date.now().toString(36).slice(-4);
    S.custom.push({id:id, name:name, cat:"Yours", track:newExtra.track});
    newExtra = {open:false, name:"", track:"time"};
    save();
    if(S.current) addExtraToSession(id); else { pick.sel = id; render(); }
    return;
  }
  if(act === "histList"){ histList = true; histDay = null; histIdx = null; previewOpen = false; render(); return; }
  if(act === "closeHist"){ histIdx = null; histList = false; histDay = null; render(); return; }
  if(act === "delSession"){
    const h = S.history[histIdx];
    if(h && confirm("Delete " + sessionTitle(h) + " from " + niceDate(h.date) + "? This cannot be undone.")){
      S.history.splice(histIdx, 1);
      histIdx = null;
      save(); render();
    }
    return;
  }
  if(act === "preview"){ previewOpen = true; render(); return; }
  if(act === "closePreview"){ previewOpen = false; render(); return; }
  if(act === "signout"){
    if(confirm("Sign out? Your training is saved to your account.")){
      if(window.__auth) window.__auth.signOut();
    }
    return;
  }
  if(act === "start"){ previewOpen = false; startSession(); }
  if(act === "startOpen"){ startOpen(); }
  if(act === "startOpenPick"){
    const sel = document.getElementById("openPick");
    const pick = sel ? sel.value : "";
    startOpen();
    if(pick) addExtraToSession(pick);
    return;
  }
  if(act === "finish"){ stopRest(); finishSession(); }
  if(act === "abandon"){
    if(confirm("Discard this session? Nothing will be saved.")){ stopRest(); S.current = null; save(); render(); }
  }
  if(act === "closeSummary"){ summaryRec = null; render(); }
  if(act === "export"){
    const txt = JSON.stringify(S.history, null, 2);
    navigator.clipboard ? navigator.clipboard.writeText(txt).then(()=>alert("History copied to the clipboard.")) : alert(txt);
  }
  if(act === "reset"){
    if(confirm("Erase every session, weight and record? This cannot be undone.")){
      S = blankState(); summaryRec = null; save(); render();
    }
  }
});

document.addEventListener("input", e=>{
  const t = e.target;
  if(t.dataset.in){
    const [field, exId, si] = t.dataset.in.split(":");
    setVal(exId + ":" + si, field, t.value === "" ? "" : Number(t.value));
    save();
  }
  if(t.dataset.hin){
    const [field, ei, si] = t.dataset.hin.split(":");
    const set = S.history[histIdx].entries[Number(ei)].sets[Number(si)];
    set[field] = t.value === "" ? 0 : Number(t.value);
    save();
  }
  if(t.dataset.new === "name"){ newExtra.name = t.value; }
  if(t.hasAttribute("data-bar-in")){ S.bar = Number(t.value) || 0; save(); }
});

/* ============================================================
   BOOT
   ============================================================ */
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}

window.ironworkSignedIn = async function(uid, profile){
  UID = uid;
  S = null;
  ACCOUNT = profile || {};
  stopRest();
  summaryRec = null; tab = "train"; pick = {open:false, sel:null}; addOpen = false;
  await loadState();
  document.getElementById("gate").hidden = true;
  render();
};

window.ironworkSignedOut = function(){
  UID = null; ACCOUNT = {}; S = blankState();
  document.getElementById("gate").hidden = false;
  document.getElementById("view").innerHTML = "";
};

(async function(){
  await loadState();
  render();
  setInterval(()=>{ if(S.current && tab === "train" && !summaryRec){ /* keep elapsed fresh, cheap */ } }, 60000);
})();
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
         signOut, GoogleAuthProvider, signInWithPopup, sendPasswordResetEmail,
         setPersistence, browserLocalPersistence }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, enableIndexedDbPersistence }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { FIREBASE_CONFIG } from "./firebase-config.js";

const gate = document.getElementById("gate");
const msg  = document.getElementById("gateMsg");
const email = document.getElementById("gEmail");
const pass  = document.getElementById("gPass");

function say(text, kind){
  msg.textContent = text;
  msg.className = "msg " + (kind || "err");
  msg.hidden = !text;
}
function friendly(e){
  const c = (e && e.code) || "";
  if(c.includes("invalid-credential") || c.includes("wrong-password") || c.includes("user-not-found"))
    return "That email and password do not match an account.";
  if(c.includes("email-already-in-use")) return "That email already has an account. Try signing in.";
  if(c.includes("weak-password")) return "Passwords need to be at least six characters.";
  if(c.includes("invalid-email")) return "That does not look like an email address.";
  if(c.includes("too-many-requests")) return "Too many attempts. Wait a minute and try again.";
  if(c.includes("popup-blocked")) return "Your browser blocked the Google popup. Allow popups and retry.";
  if(c.includes("popup-closed")) return "The Google window closed before sign-in finished.";
  if(c.includes("unauthorized-domain")) return "This domain is not authorised in Firebase yet. Add it under Authentication, Settings, Authorized domains.";
  if(c.includes("network")) return "No connection. Sign in once online and the app works offline after that.";
  return "Something went wrong signing in. Please try again.";
}

if(!FIREBASE_CONFIG.apiKey || !FIREBASE_CONFIG.projectId){
  gate.hidden = false;
  document.getElementById("gateSub").textContent =
    "Accounts are not configured yet. Add your Firebase project details to firebase-config.js.";
  ["gSignIn","gCreate","gGoogle","gReset"].forEach(id=>{
    const b = document.getElementById(id); b.disabled = true; b.style.opacity = ".45";
  });
}else{
  const app  = initializeApp(FIREBASE_CONFIG);
  const auth = getAuth(app);
  const db   = getFirestore(app);
  enableIndexedDbPersistence(db).catch(()=>{});
  await setPersistence(auth, browserLocalPersistence).catch(()=>{});

  window.__auth = { signOut: ()=> signOut(auth) };
  window.__cloud = {
    async get(uid){
      const snap = await getDoc(doc(db, "ironwork", uid));
      return snap.exists() ? snap.data().state : null;
    },
    async set(uid, state){
      await setDoc(doc(db, "ironwork", uid), { state: state, updatedAt: Date.now() });
    }
  };

  const busy = (on)=> ["gSignIn","gCreate","gGoogle"].forEach(id=>{
    const b = document.getElementById(id); b.disabled = on; b.style.opacity = on ? ".55" : "1";
  });

  document.getElementById("gSignIn").addEventListener("click", async ()=>{
    say(""); busy(true);
    try{ await signInWithEmailAndPassword(auth, email.value.trim(), pass.value); }
    catch(e){ say(friendly(e)); }
    busy(false);
  });

  document.getElementById("gCreate").addEventListener("click", async ()=>{
    say(""); busy(true);
    try{ await createUserWithEmailAndPassword(auth, email.value.trim(), pass.value); }
    catch(e){ say(friendly(e)); }
    busy(false);
  });

  document.getElementById("gGoogle").addEventListener("click", async ()=>{
    say(""); busy(true);
    try{ await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch(e){ say(friendly(e)); }
    busy(false);
  });

  document.getElementById("gReset").addEventListener("click", async ()=>{
    const addr = email.value.trim();
    if(!addr){ say("Type your email address first, then tap reset."); return; }
    try{
      await sendPasswordResetEmail(auth, addr);
      say("Reset link sent. Check your inbox.", "ok");
    }catch(e){ say(friendly(e)); }
  });

  pass.addEventListener("keydown", e=>{ if(e.key === "Enter") document.getElementById("gSignIn").click(); });

  onAuthStateChanged(auth, async (user)=>{
    if(user){
      say("");
      pass.value = "";
      await window.ironworkSignedIn(user.uid, {
        name: user.displayName || "",
        email: user.email || ""
      });
    }else{
      window.ironworkSignedOut();
    }
  });
}
</script>
</body>
