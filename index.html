<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Ironwork</title>
<meta name="description" content="Strength and conditioning tracker.">
<meta name="theme-color" content="#1B1A18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Ironwork">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --iron:#1B1A18;
  --iron-2:#26241F;
  --iron-3:#3A362E;
  --iron-line:#4A453B;
  --paper:#EDE9DF;
  --paper-2:#E3DED1;
  --paper-3:#D5CFBE;
  --rule:#C6BFAC;
  --slate:#6E685C;
  --ink:#1B1A18;
  --orange:#FF6600;
  --orange-deep:#C24E00;
  --orange-pale:#FFE0C4;
  --green:#2F6E4A;
  --green-pale:#D3E4D8;
  --ui:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--iron);
  color:var(--paper);
  font-family:var(--ui);
  font-size:16px;
  line-height:1.45;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}

.gate{position:fixed;inset:0;z-index:200;background:var(--iron);
  display:flex;align-items:center;justify-content:center;padding:24px;overflow-y:auto}
.gate[hidden]{display:none}
.gate-card{width:100%;max-width:360px}
.gate .logo{width:52px;height:36px;margin-bottom:20px}
.gate h1{font-family:var(--display);font-weight:700;font-size:38px;line-height:1;margin:0 0 6px;color:var(--paper)}
.gate p.sub{font-size:14px;color:#9A9384;margin:0 0 22px;line-height:1.5}
.gate label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:#9A9384;margin:0 0 6px}
.gate input{width:100%;padding:14px;margin-bottom:14px;border-radius:2px;
  background:var(--iron-2);border:1px solid var(--iron-line);color:var(--paper);font-size:16px}
.gate input:focus{outline:none;border-color:var(--orange)}
.gate .btn{margin-bottom:10px}
.gate .btn-alt{background:var(--iron-2);color:var(--paper);border:1px solid var(--iron-line)}
.gate .link{display:block;width:100%;text-align:center;font-size:13px;color:#9A9384;padding:10px}
.gate .link u{color:var(--orange);text-decoration:none;border-bottom:1px solid var(--orange)}
.gate .msg{font-size:13px;line-height:1.5;padding:11px 12px;border-radius:2px;margin:0 0 14px}
.gate .msg.err{background:#3A2418;color:#FFB27A}
.gate .msg.ok{background:#1F3327;color:#9FD3B0}
.gate .msg[hidden]{display:none}
.gate .or{display:flex;align-items:center;gap:12px;margin:16px 0;color:#6E685C;
  font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.gate .or::before,.gate .or::after{content:"";flex:1;height:1px;background:var(--iron-line)}
.acct{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.acct .who{flex:1;min-width:0}
.acct .who b{display:block;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct .who span{font-family:var(--mono);font-size:11px;color:var(--slate)}
.sync{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--slate)}
.sync.on{color:var(--green)}
.sync.off{color:var(--orange-deep)}

/* ---------- masthead ---------- */
.masthead{
  position:sticky;top:0;z-index:40;
  background:var(--iron);
  border-bottom:1px solid var(--iron-line);
}
.masthead-in{
  max-width:560px;margin:0 auto;padding:14px;
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
}
.mark{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:26px;display:block;flex:0 0 38px}
.mark-name{
  font-family:var(--ui);font-weight:700;font-size:15px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--paper);
}
.mark-sub{font-family:var(--mono);font-size:11px;color:#9A9384;letter-spacing:.04em}

/* ---------- panels ---------- */
.panel{
  background:var(--paper);color:var(--ink);
  border-radius:3px;
  margin:14px 0;
}
.panel-dark{
  background:var(--iron-2);color:var(--paper);
  border:1px solid var(--iron-line);border-radius:3px;
  margin:14px 0;
}
.pad{padding:16px}
.eyebrow{
  font-family:var(--mono);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--slate);margin:0 0 6px;
}
.eyebrow-l{color:#9A9384}
h1.session-title{
  font-family:var(--display);font-weight:700;font-size:40px;line-height:1;
  margin:0 0 4px;letter-spacing:-.01em;
}
h2.head{
  font-family:var(--display);font-weight:700;font-size:26px;line-height:1.1;margin:0 0 2px;
}
.lede{font-size:14px;color:var(--slate);margin:0}
.lede-l{color:#9A9384}
.rule{height:1px;background:var(--rule);border:0;margin:14px 0}
.rule-d{height:1px;background:var(--iron-line);border:0;margin:14px 0}

/* ---------- meta strip ---------- */
.meta{display:flex;gap:0;margin:14px 0 0;border-top:1px solid var(--rule)}
.meta div{flex:1;padding:10px 0 0;border-right:1px solid var(--rule)}
.meta div:last-child{border-right:0}
.meta .n{font-family:var(--mono);font-weight:600;font-size:19px;display:block;line-height:1.1}
.meta .l{font-size:11px;color:var(--slate);letter-spacing:.04em}

/* ---------- buttons ---------- */
.btn{
  display:block;width:100%;text-align:center;
  background:var(--orange);color:#FFFFFF;
  font-weight:700;font-size:15px;letter-spacing:.05em;text-transform:uppercase;
  padding:17px 16px;border-radius:2px;
  transition:transform .08s ease;
}
.btn:active{transform:translateY(2px)}
.btn-quiet{
  background:var(--paper-2);color:var(--ink);border:1px solid var(--rule);
}
.btn-ghost{
  background:none;border:1px solid var(--rule);color:var(--slate);
  font-size:13px;padding:12px;text-transform:none;letter-spacing:0;font-weight:500;
}
.btn-ghost:active{transform:none;background:var(--paper-2)}
.mini{
  font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--slate);border-bottom:1px solid var(--rule);padding:2px 0;
}
.mini:active{color:var(--orange);border-color:var(--orange)}


/* ---------- exercise card ---------- */
.ex{border-top:1px solid var(--rule)}
.ex:first-child{border-top:0}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:11px}
.ex-name{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.08;margin:0;
  display:block;text-align:left;padding:0;color:var(--ink);width:100%}
.ex-name .chev{
  display:inline-flex;margin-left:9px;vertical-align:-4px;color:var(--orange-deep);
}
.shots{display:flex;gap:10px;margin:14px 0 0;background:var(--paper-2);padding:12px;border-radius:11px}
.shots.many{flex-wrap:wrap}
.shots.many figure{flex:0 0 calc(33.333% - 7px)}
.shots figure{flex:1;margin:0;min-width:0}
.shots img{width:100%;height:auto;display:block}
.shots figcaption{font-size:11px;color:var(--slate);text-align:center;margin-top:6px;line-height:1.35}
.shots[data-failed]{display:none}
.diag.fallback{display:none}
.shots[data-failed] + .diag.fallback{display:flex}

.diag{display:flex;gap:10px;margin:14px 0 0;background:var(--paper-2);padding:12px;border-radius:2px}
.diag figure{flex:1;margin:0;min-width:0}
.diag svg{width:100%;height:auto;display:block}
.diag figcaption{font-size:11px;color:var(--slate);text-align:center;margin-top:6px;line-height:1.35}
.dfig{stroke:var(--ink);stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dkit{fill:var(--orange);stroke:none}
.dprop{stroke:var(--slate);stroke-width:3;fill:none;stroke-linecap:round}
.dground{stroke:var(--rule);stroke-width:3;stroke-linecap:round}
.dcable{stroke:var(--orange-deep);stroke-width:2;fill:none}
.ex-pattern{
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--slate);margin:0 0 3px;
}
.tag-new{
  display:inline-block;background:var(--orange-pale);color:var(--orange-deep);
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  padding:2px 6px;border-radius:2px;margin-left:6px;vertical-align:2px;
}
.target{
  font-family:var(--mono);font-size:13px;font-weight:500;margin:10px 0 0;
  display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;
}
.target b{color:var(--orange-deep);font-weight:600}
.ghost{font-family:var(--mono);font-size:12px;color:var(--slate);margin:4px 0 0}
.cue{font-size:13px;color:var(--slate);margin:8px 0 0;line-height:1.5}

/* set ladder */
.bar-line{height:2px;background:var(--paper-3);margin:14px 0 -9px}
.sets{display:flex;flex-direction:column;gap:8px;margin-top:0}
.set{
  display:flex;align-items:center;gap:8px;
  background:var(--paper-2);border-radius:2px;padding:8px;
}
.set.done{background:var(--orange-pale)}
.set-n{
  font-family:var(--mono);font-size:12px;font-weight:600;color:var(--slate);
  width:20px;flex:0 0 20px;text-align:center;
}
.set.done .set-n{color:var(--orange-deep)}
.field{display:flex;align-items:center;background:var(--paper);border-radius:2px;border:1px solid var(--rule)}
.field.grow{flex:1;min-width:0}
.step{width:34px;height:38px;font-size:19px;color:var(--slate);font-weight:600;line-height:1}
.step:active{color:var(--orange)}
.field input{
  width:100%;min-width:0;border:0;background:none;text-align:center;
  font-family:var(--mono);font-weight:600;font-size:16px;padding:0;
  border-radius:0;-webkit-appearance:none;
  -moz-appearance:textfield;
}
.field input::-webkit-outer-spin-button,.field input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.unit{font-family:var(--mono);font-size:11px;color:var(--slate);padding-right:8px}
.tick-btn{
  width:44px;height:40px;flex:0 0 44px;border-radius:2px;
  background:var(--paper);border:1px solid var(--rule);
  display:flex;align-items:center;justify-content:center;
}
.tick-btn::after{content:"";width:7px;height:13px;border:solid var(--paper-3);border-width:0 2px 2px 0;transform:rotate(45deg);margin-top:-3px}
.set.done .tick-btn{background:var(--orange);border-color:var(--orange)}
.set.done .tick-btn::after{border-color:#FFFFFF}
.pair-flag{
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--orange-deep);background:var(--orange-pale);
  padding:4px 8px;border-radius:2px;display:inline-block;margin-bottom:10px;
}

/* ---------- rest timer ---------- */
.rest{
  position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom));z-index:45;
  background:var(--orange);color:#FFFFFF;
}
.rest-in{
  max-width:560px;margin:0 auto;padding:11px 14px;
  display:flex;align-items:center;gap:12px;
}
.rest-t{font-family:var(--mono);font-weight:600;font-size:22px;letter-spacing:.02em}
.rest-l{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;flex:1}
.rest button{
  color:#FFFFFF;font-family:var(--mono);font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;border:1px solid #FFFFFF;padding:6px 9px;border-radius:2px;
}

/* ---------- nav ---------- */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:var(--iron-2);border-top:1px solid var(--iron-line);
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-in{max-width:560px;margin:0 auto;display:flex}
.nav button{
  flex:1;padding:12px 4px 13px;color:#9A9384;
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;
  border-top:2px solid var(--iron-2);
}
.nav button.on{color:var(--orange);border-top-color:var(--orange)}
.nav .g{display:block;font-family:var(--display);font-size:20px;line-height:1;margin-bottom:3px;font-weight:700}

/* ---------- progress ---------- */
.exrow{padding:13px 0;border-bottom:1px solid var(--paper-2)}
.exrow:last-child{border-bottom:0}
.exrow-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.exrow-name{font-family:var(--display);font-size:20px;font-weight:700;line-height:1.1}
.exrow-n{font-family:var(--mono);font-size:13px;font-weight:600;white-space:nowrap}
.exrow-sub{font-family:var(--mono);font-size:11px;color:var(--slate);margin-top:3px}
.spark{display:block;margin-top:8px}
.delta-up{color:var(--green)}
.delta-flat{color:var(--slate)}
.delta-down{color:var(--orange-deep)}

.libslot{padding:14px 0;border-bottom:1px solid var(--paper-2)}
.libslot:last-child{border-bottom:0}
.libslot h3{font-family:var(--display);font-size:19px;font-weight:700;margin:0 0 6px}
.libslot ul{list-style:none;margin:0;padding:0}
.libslot li{
  font-size:13px;padding:6px 0 6px 16px;position:relative;color:var(--slate);
  border-bottom:1px solid var(--paper-2);cursor:pointer;
}
.libslot li .cue{margin:6px 0 0}
.libslot li:last-child{border-bottom:0}
.libslot li.cur{color:var(--ink);font-weight:600}
.libslot li.cur::before{content:"";position:absolute;left:0;top:12px;width:8px;height:8px;background:var(--orange);border-radius:1px}

.atiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 16px}
.atile{background:var(--green);border:0;border-radius:8px;padding:16px 8px 13px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:104px;cursor:pointer}
.atile img{width:40px;height:40px;display:block}
.atile b{color:#FFFFFF;font-size:13.5px;font-weight:600;text-align:center;line-height:1.3;font-family:var(--ui)}
.atile:active{transform:translateY(2px)}
.atile.on{outline:3px solid var(--orange);outline-offset:2px}
.atile.mid{grid-column:1 / -1;justify-self:center;width:calc(50% - 4px)}
.achosen{display:flex;align-items:center;gap:11px;margin:4px 0 14px}
.abadge{width:56px;height:56px;border-radius:8px;background:var(--green);display:flex;
  align-items:center;justify-content:center;flex:none}
.abadge img{width:34px;height:34px;display:block}
.amode{width:100%;background:var(--green);border:0;border-radius:8px;padding:14px 15px;text-align:left;
  cursor:pointer;margin-bottom:8px;font-family:var(--ui)}
.amode:active{transform:translateY(2px)}
.amode b{color:#FFFFFF;font-size:15px;font-weight:600;display:block}
.amode span{color:rgba(255,255,255,.82);font-size:11.5px;display:block;margin-top:2px;line-height:1.45}
.amode.alt{background:var(--paper);border:1.5px solid var(--green)}
.amode.alt b{color:var(--green)}
.amode.alt span{color:#4A6B57}
.rgrid{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:5px;margin:12px 0 0;align-items:center}
.rgl{font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;color:var(--slate);text-align:center}
.rbx{height:42px;border-radius:3px;background:var(--paper-3);border:0;padding:0;font-family:var(--ui);
  font-size:11.5px;font-weight:600;color:var(--slate);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px}
.rbx small{font-family:var(--mono);font-size:8px;font-weight:400;opacity:.85}
.rbx.on{background:var(--orange);color:#FFFFFF}
.rbx.late{background:var(--orange-deep);color:#FFFFFF}
.rbx.next{background:var(--paper);border:2px solid var(--orange);color:var(--orange-deep)}
.rbx.due{color:#8C857A;font-weight:400}
.rbx.due:active,.rbx.next:active{transform:translateY(2px)}
.rbx.on:active,.rbx.late:active,.rgb:active{transform:translateY(2px)}
.rgb{height:36px;border-radius:3px;background:var(--green);color:#FFFFFF;border:0;font-family:var(--ui);
  display:flex;align-items:center;justify-content:center;gap:5px;font-size:12px;font-weight:600;padding:0}
.rgb.none{background:var(--paper-3);color:var(--slate)}
.rkey{display:flex;gap:12px;margin-top:12px;font-size:10.5px;color:var(--slate);align-items:center;flex-wrap:wrap}
.rkey i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:-1px}
.histrow.inblock{background:var(--green-pale)}
.cad{display:flex;gap:3px;margin:14px 0 5px}
.cad i{flex:1;height:32px;background:var(--paper-2);border-radius:1px;display:block}
.cad i.on{background:var(--orange)}
.cad i.open{background:var(--paper);border:2px solid var(--orange)}
.cad i.today{border-bottom:3px solid var(--ink)}
.cad-l{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--slate)}
.cad button{flex:1;height:32px;background:var(--paper-2);border-radius:1px;display:block;padding:0;
  border:0;cursor:pointer;transition:transform .08s ease}
.cad button.on{background:var(--orange)}
.cad button.open{background:var(--paper);border:2px solid var(--orange)}
.cad button.today{border-bottom:3px solid var(--ink)}
.cad button:active{transform:translateY(2px)}

.numlink{font-family:var(--mono);font-weight:600;font-size:19px;line-height:1.1;padding:0;
  color:var(--orange-deep);border-bottom:1px solid var(--orange-deep);display:inline-block}
.numlink:active{opacity:.6}

.histrow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:11px 0;border-bottom:1px solid var(--paper-2);color:var(--ink)}
.histrow:last-of-type{border-bottom:0}
.histrow b{display:block;font-family:var(--display);font-size:19px;font-weight:700;line-height:1.15}
.histrow span span{font-family:var(--mono);font-size:11px;color:var(--slate)}
.histrow .chev-r{font-size:22px;color:var(--rule);line-height:1}
.histrow:active{opacity:.6}
.tag-open{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--slate);vertical-align:2px}
.tick-btn.rm{font-size:20px;color:var(--slate);line-height:1}
.tick-btn.rm::after{display:none}
.tick-btn.rm:active{background:var(--orange-pale);color:var(--orange-deep)}

.setting{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--paper-2)}
.setting:last-of-type{border-bottom:0}
.setting label{font-size:14px;font-weight:500}
.setting .hint{font-size:12px;color:var(--slate);display:block;font-weight:400;margin-top:2px}
.xstrip{display:flex;gap:6px;margin:10px 0 0}
.xcell{flex:1;min-width:0;background:var(--paper-2);border-radius:11px;padding:9px 3px;
  display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink);
  transition:transform .08s ease}
.xcell:active{transform:translateY(2px)}
.xico{color:var(--orange-deep);display:block}
.xcell b{font-family:var(--mono);font-size:13px;font-weight:600;line-height:1}
.xcell b i{font-style:normal;font-size:9px;color:var(--slate);margin-left:1px}
.xcell span:last-child{font-family:var(--mono);font-size:9px;letter-spacing:.04em;color:var(--slate)}

.avgrow{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--paper-2)}
.avgrow:last-of-type{border-bottom:0}
.avgrow b{display:block;font-size:14px;font-weight:500;line-height:1.2}
.avgrow span span{font-family:var(--mono);font-size:11px;color:var(--slate)}
.avgnum{font-family:var(--mono);font-size:18px;font-weight:600;white-space:nowrap}

/* history written before profiles existed used three fixed tracks */
const TRACK_TO_PROFILE = {load:"strength", time:"duration", distance:"distance"};
function profileOf(x){
  return x.profile || TRACK_TO_PROFILE[x.track] || "duration";
}

/* kept so older records still render */
const TRACK = {
  load:{label:"Weight and reps"}, time:{label:"Time and effort"}, distance:{label:"Distance and time"}
};

function allExtras(){ return EXTRAS.concat(S.custom || []); }

/* A custom activity created before the matching built-in one existed leaves two
   entries with the same name in the Library — one with all the history, one
   unused. Fold the custom one onto the built-in, keeping every logged session,
   and drop the duplicate. Runs on load; does nothing when there is nothing to
   merge. */
function mergeDuplicateExtras(){
  if(!S.custom || !S.custom.length) return [];
  const norm = n => String(n || "").trim().toLowerCase();
  const merged = [];

  S.custom.slice().forEach(mine =>{
    const builtIn = EXTRAS.find(x => norm(x.name) === norm(mine.name));
    if(!builtIn) return;

    let moved = 0;
    const repoint = e =>{
      if(e.exId !== mine.id) return;
      e.exId = builtIn.id;
      e.name = builtIn.name;
      delete e.profile;        // resolved from the definition at render time
      delete e.profileLocked;
      moved++;
    };
    S.history.forEach(h => h.entries.forEach(repoint));
    if(S.current) S.current.entries.forEach(repoint);

    S.custom = S.custom.filter(x => x.id !== mine.id);
    merged.push({name: builtIn.name, from: mine.id, to: builtIn.id, moved: moved});
  });

  if(merged.length){
    S.mergeLog = (S.mergeLog || []).concat(merged);
    save();
  }
  return merged;
}

/* resolve any exercise id — programme or extra */
function findEx(exId){
  for(const k in SLOTS){
    const f = SLOTS[k].pool.find(x => x.id === exId);
    if(f) return {ex:f, label:SLOTS[k].label, track:"load", profile:"strength", slot:k};
  }
  const e = allExtras().find(x => x.id === exId);
  if(e) return {ex:e, label:e.cat, track:e.track, profile:profileOf(e)};
  return null;
}

/* ============================================================
   MOVEMENT DIAGRAMS
   A small side-on stick figure. Each pose is eight points:
   Head, Neck, Elbow, Wrist, Pelvis, Knee, Ankle, Toe.
   ============================================================ */
const mk = (H,N,E,W,P,K,A,T) => ({H:H,N:N,E:E,W:W,P:P,K:K,A:A,T:T});
function L(a,b){return '<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'"/>';}
function fig(p){
  return '<g class="dfig"><circle cx="'+p.H[0]+'" cy="'+p.H[1]+'" r="10"/>' +
    L(p.H,p.N)+L(p.N,p.P)+L(p.N,p.E)+L(p.E,p.W)+L(p.P,p.K)+L(p.K,p.A)+L(p.A,p.T)+'</g>';
}
function limb(pts){return '<polyline class="dfig" points="'+pts.map(p=>p[0]+','+p[1]).join(" ")+'"/>';}
function plate(x,y,r){return '<circle class="dkit" cx="'+x+'" cy="'+y+'" r="'+(r||15)+'"/>';}
function dbell(x,y){return '<g class="dkit"><rect x="'+(x-3)+'" y="'+(y-5)+'" width="6" height="10"/>' +
  '<rect x="'+(x-9)+'" y="'+(y-10)+'" width="18" height="5" rx="2"/>' +
  '<rect x="'+(x-9)+'" y="'+(y+5)+'" width="18" height="5" rx="2"/></g>';}
function prop(pts){return '<polyline class="dprop" points="'+pts.map(p=>p[0]+','+p[1]).join(" ")+'"/>';}
function cable(a,b){return '<polyline class="dcable" points="'+a[0]+','+a[1]+' '+b[0]+','+b[1]+'"/>';}
function stack(x,top){return prop([[x-11,top],[x-11,186],[x+11,186],[x+11,top],[x-11,top]]);}
const GRD = '<line class="dground" x1="8" y1="186" x2="192" y2="186"/>';
const RACK = prop([[26,186],[26,16],[174,16],[174,186]]);
function benchFlat(x1,x2,y){return prop([[x1,y],[x2,y]]) + prop([[x1+9,y],[x1+9,186]]) + prop([[x2-9,y],[x2-9,186]]);}

        'alt="' + esc(caps[i-1] || "") + '" ' +
        'onerror="this.closest(\'.shots\').dataset.failed=1">' +
      '<figcaption>' + esc(caps[i-1] || "") + '</figcaption></figure>';
  }
  return '<div class="shots' + (n > 2 ? " many" : "") + '">' + cells + '</div>';
}

/* the app's own drawn diagram, used when there is no photograph or the
   photograph fails to load */
function drawnDiagram(exId, extraClass){
  const a = ARCH[DIAG[exId]];
  if(!a) return "";
  return '<div class="diag' + (extraClass ? " " + extraClass : "") + '">' + a.f.map((fr, i)=>
    '<figure><svg viewBox="0 0 200 200" role="img" aria-label="' + esc(a.caps[i]) + '">' +
      (fr.k || "") + fig(fr.p) +
    '</svg><figcaption>' + esc(a.caps[i]) + '</figcaption></figure>').join("") + '</div>';
}

function diagram(exId){
  const shot  = shots(exId);
  const drawn = drawnDiagram(exId, "fallback");
  /* both: the photograph, with the drawing behind it if the file is missing */
  if(shot && drawn) return shot + drawn;
  if(shot) return shot;
  return drawnDiagram(exId);
}

function userKey(){ return UID ? KEY + ":" + UID : KEY; }

function pickNewer(a, b){
  if(!a) return b;
  if(!b) return a;
  return (b.updatedAt || 0) > (a.updatedAt || 0) ? b : a;
}

function readLocal(k){
  try{ const raw = localStorage.getItem(k); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}

async function loadState(){
  const local = readLocal(userKey());
  let cloud = null;
  if(window.__cloud && UID){
    try{ cloud = await window.__cloud.get(UID); cloudOK = true; }
    catch(e){ cloudOK = false; }

  if(!S){
    const legacy = readLocal(KEY);
    if(legacy && legacy.history && legacy.history.length){
      S = legacy;
      S.updatedAt = Date.now();
    }
  }
  if(!S || !S.v) S = blankState();
  if(!S.custom) S.custom = [];
  mergeDuplicateExtras();

  try{ localStorage.setItem(userKey() + ":probe", "1"); localStorage.removeItem(userKey() + ":probe"); }
  catch(e){ storageOK = false; }

  /* if the cloud was empty or behind, push what we have up */
  if(UID && window.__cloud && (!cloud || (S.updatedAt || 0) > (cloud.updatedAt || 0))) pushCloud();
}

let cloudTimer = null;
function pushCloud(){
  if(!UID || !window.__cloud) return;
  clearTimeout(cloudTimer);
  cloudPending = true;
  cloudTimer = setTimeout(async ()=>{
    try{
      await window.__cloud.set(UID, S);
      cloudPending = false;
      if(!cloudOK){ cloudOK = true; render(); }
    }catch(e){
      cloudPending = false;
      if(cloudOK){ cloudOK = false; render(); }
    }
  }, 1200);
}

let saveQueued = false;
function save(){
  S.updatedAt = Date.now();
  if(!saveQueued){
    saveQueued = true;
    setTimeout(()=>{
      saveQueued = false;
      try{ localStorage.setItem(userKey(), JSON.stringify(S)); }
      catch(e){ if(storageOK){ storageOK = false; render(); } }
    }, 120);
  }
  pushCloud();
}

/* ============================================================
   PROGRAMME LOGIC
   ============================================================ */
function sessionAt(i){ return SESSIONS[i % 3]; }

/* every slot lives in exactly one session — used to label progress rows */
const SLOT_SESSION = (function(){
  const m = {};
  SESSIONS.forEach(x => x.blocks.forEach(b => b.items.forEach(it => { m[it.slot] = x.title; })));
  return m;
})();

/* the lifts a session contains right now, as a single line */
function contentsOf(sess, idx){
  const out = [];
  sess.blocks.forEach(b => b.items.forEach(it => out.push(variantFor(it.slot, idx).name)));
  return out.join(" · ");
}
function cycleAt(i){ return Math.floor(i / 3); }

function variantFor(slotId, sessionIndex){
  const pool = SLOTS[slotId].pool;
  const auto = Math.floor(cycleAt(sessionIndex) / ROTATE_EVERY);
  const manual = S.nudge[slotId] || 0;
  return pool[(auto + manual) % pool.length];
}

function isNewVariant(slotId, sessionIndex){
  if(sessionIndex < 3) return false;
  return variantFor(slotId, sessionIndex).id !== variantFor(slotId, sessionIndex - 3).id;
}

function isDeload(i){ return i > 0 && i % DELOAD_EVERY === (DELOAD_EVERY - 1); }

function step(kind){
  if(S.units === "lb") return kind === "dumbbell" ? 5 : 2.5;
  return kind === "dumbbell" ? 1 : 1.25;
}
function incFor(ex){
  return S.units === "lb" ? Math.round(ex.inc * 2.2 / 2.5) * 2.5 : ex.inc;
}
function roundLoad(w, ex){
  const st = step(ex.kind);
  return Math.round(w / st) * st;
}
function fmt(n){
  if(n === null || n === undefined || isNaN(n)) return "—";
  return (Math.round(n * 100) / 100).toString();
}

/* last completed performance of a given exercise id */
function lastPerf(exId){
  for(let i = S.history.length - 1; i >= 0; i--){
    const e = S.history[i].entries.find(x => x.exId === exId && x.sets.some(s => s.done));
    if(e) return {entry:e, session:S.history[i]};
  }
  return null;
}
function topWeight(sets){ return sets.reduce((m,s)=> Math.max(m, s.w), 0); }

/* a true one-rep max only counts if a single was actually completed */
function trueSingle(sets){
  const singles = sets.filter(s => s.r === 1);
  return singles.length ? singles.reduce((m,s)=> Math.max(m, s.w), 0) : null;
}

function allPerf(exId){
  const out = [];
  S.history.forEach(h=>{
    const e = h.entries.find(x => x.exId === exId && x.sets.some(s => s.done));
    if(e){
      const done = e.sets.filter(s=>s.done);
      out.push({
        date:h.date,
        sets:done,
        top: topWeight(done),
        single: trueSingle(done),
        vol: done.reduce((m,s)=> m + s.w * s.r, 0)
      });
    }
  });
  return out;
}

/* has this exercise ever been taken to a genuine single? */
function anySingle(hist){ return hist.some(x => x.single !== null); }

/* the learning bit: what should today's load be? */
function suggest(ex, item, sessionIndex){
  const hist = allPerf(ex.id);

  /* bodyweight-only movements have no load to progress, so the whole
     double-progression ladder collapses to one rung: add reps */
  if(ex.bwOnly){
    if(!hist.length) return {w:0, why:"First time — stop each set 2 reps short of failure."};
    const sets = hist[hist.length - 1].sets;
    const best = sets.reduce((n,x)=> Math.max(n, x.r), 0);
    const allTop = sets.length >= item.sets && sets.every(x => x.r >= item.hi);
    const anyLow = sets.some(x => x.r < item.lo);
    if(isDeload(sessionIndex))
      return {w:0, why:"Deload session — same reps, but stop well short and move cleanly."};
    if(allTop)
      return {w:0, why:"Top of the range on every set. Add a rep, or slow the lower to keep it hard."};
    if(anyLow)
      return {w:0, why:"Some sets under the range. Hold here until all " + item.sets + " reach " + item.lo + "."};
    return {w:0, why:"Best set was " + best + ". Chase " + item.hi + " on every set."};
  }

  if(!hist.length) return {w:null, why:"First time on this lift — find a load you could stop 2 reps short of."};

  const last = hist[hist.length - 1];
  const doneSets = last.sets;
  const allTop = doneSets.length >= item.sets && doneSets.every(s => s.r >= item.hi);
  const anyLow = doneSets.some(s => s.r < item.lo);
  const w = doneSets[doneSets.length - 1].w;

  let prevLow = false;
  if(hist.length > 1){
    prevLow = hist[hist.length - 2].sets.some(s => s.r < item.lo);
  }

  let out, why;
  if(allTop){
    out = roundLoad(w + incFor(ex), ex);
    why = "Top of the range on every set last time — load goes up.";
  }else if(anyLow && prevLow){
    out = roundLoad(w * 0.9, ex);
    why = "Two sessions under the range — backing off 10% to rebuild.";
  }else if(anyLow){
    out = w;
    why = "Same load. Get every set into the range before adding weight.";
  }else{
    out = w;
    why = "Same load. Chase reps until all sets hit " + item.hi + ".";
  }

  if(isDeload(sessionIndex)){
    out = roundLoad(out * 0.85, ex);
    why = "Deload session — 85% of your working load, moved fast and clean.";
  }
  return {w:out, why:why};
}

function estimateMinutes(sess){
  let secs = 0;
  sess.blocks.forEach(b=>{
    const work = b.items.length * 45;
    const sets = b.items[0].sets;
    secs += sets * (work + b.rest);
  });
  return Math.round(secs / 60);
}

/* ============================================================
   SESSION LIFECYCLE
   ============================================================ */
function startSession(){
  const i = S.sessionIndex;
  const sess = sessionAt(i);
  const entries = [];
  sess.blocks.forEach((b, bi)=>{
    b.items.forEach(item=>{
      const ex = variantFor(item.slot, i);
      const sug = suggest(ex, item, i);
      const lp = lastPerf(ex.id);
      const prefillR = lp ? lp.entry.sets.filter(s=>s.done).slice(-1)[0].r : item.hi;
      entries.push({
        block:bi, slot:item.slot, exId:ex.id, track:"load",
        sets:Array.from({length:item.sets}, ()=>({
          w: sug.w === null ? "" : sug.w,
          r: prefillR,
          done:false
        }))
      });
    });
  });
  S.current = {index:i, key:sess.key, startedAt:Date.now(), entries:entries};
  addOpen = false;
  save(); render();
}

function startOpen(when){
  S.current = {index:S.sessionIndex, key:"X", open:true, startedAt:Date.now(), entries:[]};
  if(when) S.current.retro = when;
  addOpen = false;
  save(); render();
}

function finishSession(){
  const c = S.current;
  const done = c.entries.reduce((n,e)=> n + e.sets.filter(s=>s.done).length, 0)
    + c.entries.filter(e => e.meta && (e.meta.score || e.meta.course)).length;
  if(done === 0){
    if(!confirm("No sets logged. Discard this session?")) return;
    S.current = null; save(); render(); return;
  }
  const when = c.retro ? keyDate(c.retro) : new Date();
  const rec = {
    date: when.toISOString(),
    day: dayKey(when),
    tz: (function(){ try{ return Intl.DateTimeFormat().resolvedOptions().timeZone; }catch(e){ return ""; } })(),
    key: c.key, index: c.index, open: !!c.open,
    title: c.open ? (c.entries[0] ? (c.entries[0].name || "Open session") : "Open session") : null,
    minutes: c.retro
      ? c.entries.reduce((n,e)=> n + ((e.track === "time" || e.track === "distance")
          ? e.sets.reduce((m,x)=> m + (e.track === "time" ? x.w : x.r), 0) : 0), 0)
      : Math.round((Date.now() - c.startedAt) / 60000),
    entries: c.entries.map(e=>({
      slot:e.slot, exId:e.exId, track:e.track || "load", profile:entryProfile(e), extra:!!e.extra, name:e.name, meta:e.meta || {},
      sets:e.sets.filter(s=>s.done).map(s=>({w:Number(s.w)||0, r:Number(s.r)||0, done:true}))
    })).filter(e => e.sets.length || (e.meta && (e.meta.score || e.meta.course)))
  };
  /* a round's effort stands as the session's, unless one is already set */
  if(!rec.effort){
    const withEffort = rec.entries.find(e => e.meta && e.meta.effort);
    if(withEffort) rec.effort = withEffort.meta.effort;
  }

  /* any golf course played is remembered, however it was entered */
  rec.entries.forEach(e=>{
    const m = e.meta;
    if(m && m.course){
      let tees = m.tees || [];
      if(!tees.length && m.parManual){
        tees = [{name: m.teeName || "Default", par: Number(m.parManual)}];
      }
      rememberCourse({name:m.course, tees:tees});
    }
  });

  S.history.push(rec);
  addOpen = false;
  if(!c.open) S.sessionIndex = c.index + 1;
  S.current = null;
  save();
  tab = "train";
  render();
  showSummary(rec);
}

let summaryRec = null;
function showSummary(rec){ summaryRec = rec; render(); }

/* ============================================================

function beep(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const c = new Ctx();
    const o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination);
    o.frequency.value = 660; g.gain.value = 0.06;
    o.start(); o.stop(c.currentTime + 0.18);
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate(200);
}
function startRest(secs, label){
  clearInterval(restTimer);
  restLeft = secs; restLabel = label;
  drawRest();
  restTimer = setInterval(()=>{
    restLeft--;
    if(restLeft <= 0){ clearInterval(restTimer); restTimer = null; beep(); }
    drawRest();
  }, 1000);
}
function stopRest(){ clearInterval(restTimer); restTimer = null; restLeft = 0; drawRest(); }
function drawRest(){
  const host = document.getElementById("restHost");
  if(!restTimer && restLeft <= 0){ host.innerHTML = ""; return; }
  const m = Math.floor(restLeft / 60), s = restLeft % 60;
  host.innerHTML =
    '<div class="rest"><div class="rest-in">' +
      '<span class="rest-t">' + m + ":" + String(s).padStart(2, "0") + '</span>' +
      '<span class="rest-l">' + restLabel + '</span>' +
      '<button data-rest="add">+30s</button>' +
      '<button data-rest="skip">Skip</button>' +
    '</div></div>';
}

function storageWarn(){

/* ---------- home dashboard helpers ---------- */
function dayKey(d){
  const x = new Date(d);
  return x.getFullYear() + "-" +
    String(x.getMonth() + 1).padStart(2, "0") + "-" +
    String(x.getDate()).padStart(2, "0");
}

function startOfDay(d){ const x = new Date(d); x.setHours(0,0,0,0); return x.getTime(); }

/* the calendar day a session belongs to, as it was where you trained.
   Older records predate the stamp, so fall back to the device's reading. */
function recDay(h){ return h.day || dayKey(h.date); }

/* a YYYY-MM-DD key as a local moment, safe for date maths */
function keyDate(k){
  const p = String(k).split("-");
  return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]), 12, 0, 0, 0);
}
function daysSinceKey(k){ return daysBetween(keyDate(k), new Date()); }

function zoneName(tz){
  if(!tz) return "";
  const bit = tz.split("/").pop();
  return bit ? bit.replace(/_/g, " ") : "";
}
function loggedElsewhere(h){
  if(!h.tz) return "";
  let here = "";
  try{ here = Intl.DateTimeFormat().resolvedOptions().timeZone; }catch(e){}
  return (here && h.tz !== here) ? zoneName(h.tz) : "";
}

/* whole calendar days between two moments — trained at 7pm yesterday and it is
   9am now is one day, not zero */
function daysBetween(a, b){
  return Math.round((startOfDay(b) - startOfDay(a)) / 86400000);
}

/* the nine-session block the rotation is currently inside */
function blockBounds(i){
  const start = Math.floor(i / (ROTATE_EVERY * 3)) * (ROTATE_EVERY * 3);
  return {start: start, end: start + (ROTATE_EVERY * 3) - 1};
}

/* programme sessions logged inside the block, keyed by session index */
function blockSessions(i){
  const b = blockBounds(i);
  const byIndex = {};
  S.history.forEach((h, idx)=>{
    if(h.open) return;
    if(typeof h.index !== "number") return;
    if(h.index < b.start || h.index > b.end) return;
    byIndex[h.index] = {h:h, i:idx};
  });
  return byIndex;
}

/* the first day the block was trained — anything since counts as alongside */
function blockStartDay(i){
  const done = blockSessions(i);
  const keys = Object.keys(done).map(Number).sort((a,c)=> a - c);
  if(keys.length) return recDay(done[keys[0]].h);

  /* nothing logged in this block yet — the window opens the day after the
     last session of the previous one, so aerobic work still shows */
  const b = blockBounds(i);
  let prev = null;
  S.history.forEach(h=>{
    if(h.open || typeof h.index !== "number" || h.index >= b.start) return;
    const k = recDay(h);
    if(!prev || k > prev) prev = k;
  });
  if(prev){
    const d = keyDate(prev); d.setDate(d.getDate() + 1);
    return dayKey(d);
  }

  /* no programme history at all — count everything logged so far */
  let first = null;
  S.history.forEach(h=>{ const k = recDay(h); if(!first || k < first) first = k; });
  return first || dayKey(new Date());
}

/* open sessions logged since the block began, grouped by exercise */
function blockAlongside(i){
  const from = blockStartDay(i);
  const groups = {};
  S.history.forEach(h=>{
    if(!h.open || !h.entries.length) return;
    if(recDay(h) < from) return;
    const e = h.entries[0];
    const g = groups[e.exId] || (groups[e.exId] = {exId:e.exId, name:e.name || "Session", n:0});
    g.n++;
  });
  return Object.keys(groups).map(k=> groups[k]).sort((a,c)=> c.n - a.n).slice(0, 3);
}

/* the day a not-yet-done session falls due: every other day from the last
   one actually logged, so slipping shifts the whole tail rather than leaving
   a schedule you are already behind */
function dueDay(n){
  let lastDay = null, lastIdx = null;
  S.history.forEach(h=>{
    if(h.open || typeof h.index !== "number") return;
    if(lastIdx === null || h.index > lastIdx){ lastIdx = h.index; lastDay = recDay(h); }
  });
  const from = lastDay || dayKey(new Date());
  const base = lastIdx === null ? n : n - lastIdx;
  const d = keyDate(from); d.setDate(d.getDate() + base * 2);
  return dayKey(d);
}

function shortDate(key){
  return keyDate(key).toLocaleDateString("en-US", {month:"short", day:"numeric"});
}

/* days between two YYYY-MM-DD keys — distinct from daysBetween, which takes
   Date objects. Two functions, two names, on purpose. */
function dayGap(aKey, bKey){
  return Math.round((keyDate(bKey) - keyDate(aKey)) / 86400000);
}

function cadence(days){
  const trained = {};
  S.history.forEach(h=>{
    const k = recDay(h);
    if(!trained[k]) trained[k] = {s:false, o:false};
    if(h.open) trained[k].o = true; else trained[k].s = true;
  });
  const out = [];
  for(let i = days - 1; i >= 0; i--){
    const d = new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate() - i);
    const k = dayKey(d);
    out.push({key:k, s:trained[k] ? trained[k].s : false, o:trained[k] ? trained[k].o : false, today:i === 0});
  }
  return out;
}

function slotPerf(slotId){
  const out = [];
  S.history.forEach(h=>{
    const e = h.entries.find(x => x.slot === slotId && (x.track || "load") === "load");
    if(e && e.sets.length){
      out.push({date:h.date, exId:e.exId, top:topWeight(e.sets), single:trueSingle(e.sets)});
    }
  });
  return out;
}

/* the headline number for an activity, by profile */
function entryHeadline(e){
  const prof = entryProfile(e);
  const m = e.meta || {};
  if(prof === "golf"){
    return m.score ? {v:Number(m.score), unit:"", word:"score"} : null;
  }
  if(prof === "distance"){
    const km = e.sets.reduce((n,x)=> n + (Number(x.w)||0), 0);
    return km ? {v:km, unit:"km", word:"distance"} : null;
  }
  if(prof === "strength") return null;
  const mins = e.sets.reduce((n,x)=> n + (Number(x.w)||0), 0);
  return mins ? {v:mins, unit:"min", word:"time"} : null;
}

/* every non-programme activity, averaged over everything logged */
function activityAverages(){
  const by = {};
  S.history.forEach(h => h.entries.forEach(e=>{
    if(!e.extra) return;
    const hd = entryHeadline(e);
    if(!hd) return;
    const k = e.exId;
    if(!by[k]) by[k] = {exId:k, name:e.name, unit:hd.unit, word:hd.word, total:0, n:0, last:h.date};
    by[k].total += hd.v; by[k].n++;
    if(new Date(h.date) > new Date(by[k].last)) by[k].last = h.date;
  }));
  return Object.values(by)
    .map(x=>({...x, avg:x.total / x.n}))
    .sort((a,b)=> new Date(b.last) - new Date(a.last));
}

/* the most recent sessions containing anything other than the programme */
function recentExtraSessions(n){
  /* oldest to newest, left to right, so the most recent sits on the right */
  return S.history
    .map((h,i)=>({h:h, i:i}))
    .filter(r => r.h.entries.some(e => e.extra))
    .slice(-n);
}

function extrasTally(){
  let km = 0, mins = 0, count = 0;
  S.history.forEach(h => h.entries.forEach(e=>{
    const tr = e.track || "load";
    if(tr === "distance"){ km += e.sets.reduce((n,s)=> n + s.w, 0); mins += e.sets.reduce((n,s)=> n + s.r, 0); count++; }
    if(tr === "time"){ mins += e.sets.reduce((n,s)=> n + s.w, 0); count++; }
  }));
  return {km:km, mins:mins, count:count};
}


/* ---------- history: list ---------- */
function effortWord(n){
  return n <= 2 ? "Very easy" : n <= 4 ? "Easy" : n <= 6 ? "Moderate"
       : n <= 8 ? "Hard" : "All out";
}

/* the record the effort and duration controls are editing */
function ctxEntry(ctx){
  const bits = String(ctx).split(":");
  if(bits[0] === "cur" && S.current) return S.current.entries.find(e => e.exId === bits.slice(1).join(":"));
  if(bits[0] === "hist" && histIdx !== null) return S.history[histIdx].entries[Number(bits[1])];
  return null;
}

/* a session that is only golf has no meaningful duration */
function golfOnly(rec){
  return !!rec && !!rec.entries && rec.entries.length > 0 &&
    rec.entries.every(e => entryProfile(e) === "golf");
}

function targetRec(){ return summaryRec || (histIdx !== null ? S.history[histIdx] : null); }

function effortBlock(rec){
  const e = rec.effort || 0;
  let cells = "";
  for(let n = 1; n <= 10; n++){
    cells += '<button class="rpe-c' + (n <= e ? " on" : "") + (n === e ? " tip" : "") +
      '" data-effort="' + n + '" aria-label="Effort ' + n + ' out of 10">' + n + '</button>';
  }
  return '<p class="eyebrow">How hard was it</p>' +
    '<div class="rpe">' + cells + '</div>' +
    '<p class="lede" style="font-size:13px;margin-top:7px">' +
      (e ? '<b>' + e + '/10</b> · ' + esc(effortWord(e)) + (rec.effort ? ' <button class="mini" data-act="clearEffort">Clear</button>' : '')
         : 'Not recorded. Tap a number — you can do this days later.') + '</p>';
}

function durationBlock(rec){
  return '<p class="eyebrow" style="margin-top:16px">How long it took</p>' +
    '<div class="field" style="width:150px">' +
      '<button class="step" data-mins="-1" aria-label="Less">−</button>' +
      '<input type="number" inputmode="numeric" data-minsin value="' + (rec.minutes || 0) + '" aria-label="Minutes">' +
      '<span class="unit">min</span>' +
      '<button class="step" data-mins="1" aria-label="More">+</button>' +
    '</div>';
}

function entryLine(e){
  const P = PROFILES[entryProfile(e)] || PROFILES.duration;
  const m = e.meta || {};
  if(P.golf){
    const par = golfPar(m);
    return (m.score ? m.score + (par ? " (" + vsPar(m.score, par) + ")" : "") : "round") +
      (m.course ? " · " + m.course : "");
  }
  const a = e.sets.reduce((n,x)=> n + (Number(x.w)||0), 0);
  const b = e.sets.reduce((n,x)=> n + (Number(x.r)||0), 0);
  if(P.pace) return fmt(Math.round(a*10)/10) + " " + P.a.unit() + " in " + fmt(b) + " min · " + paceOf(e);
  if(entryProfile(e) === "strength") return e.sets.length + " sets";
  return fmt(a) + " " + P.a.unit();
}

function sessionTitle(h){
  if(h.open) return h.title || "Open session";
  const sess = SESSIONS.find(x => x.key === h.key);
  return sess ? sess.title : "Session";
}
function niceDate(d){
  return new Date(d).toLocaleDateString("en-GB", {weekday:"short", day:"numeric", month:"short"});
}
function recDateLabel(h){ return keyDate(recDay(h)).toLocaleDateString("en-GB", {weekday:"short", day:"numeric", month:"short"}); }

      '<span class="ex-icon">' + icon(iconFor(histEx), 18) + '</span>' +

/* ---------- history: one session, editable ---------- */
function histRows(ei, entry){
  const P = PROFILES[entryProfile(entry)] || PROFILES.duration;
  if(P.golf) return "";
  const f = findEx(entry.exId);
  const exKind = (f && f.ex && f.ex.kind) ? f.ex.kind : null;
  const cell = (kind, si, val, cfg)=>{
    return '<div class="field grow">' +
      '<button class="step" data-hnudge="' + kind + ':-1:' + ei + ':' + si + '" aria-label="Less">−</button>' +
      '<input type="number" inputmode="decimal" data-hin="' + kind + ':' + ei + ':' + si + '" value="' + val + '" aria-label="' + cfg.unit() + '">' +
      '<span class="unit">' + cfg.unit() + '</span>' +
      '<button class="step" data-hnudge="' + kind + ':1:' + ei + ':' + si + '" aria-label="More">+</button>' +
    '</div>';
  };
  let out = entry.sets.map((st, si)=>
    '<div class="set">' +
      '<span class="set-n">' + (si + 1) + '</span>' +
      cell("w", si, st.w, P.a) +
      (P.b ? cell("r", si, st.r, P.b) : "") +
      '<button class="tick-btn rm" data-hrmset="' + ei + ':' + si + '" aria-label="Delete">×</button>' +
    '</div>').join("");
  if(P.pace){
    const p = paceOf(entry);
    if(p) out += '<div class="derived">' + p + '</div>';
  }
  return out;
}

        '</div>' +

      (PROFILES[entryProfile(entry)].golf ? "" :

          esc(PROFILES[entryProfile(entry)].setLabel || "set") + '</button></div>') +

  html += '<div class="panel"><div class="pad">' +
    '<button class="add-big' + (histAdd ? " on" : "") + '" data-act="toggleHistAdd">' +

  '</div></div>';
  return html;
}

    b.items.forEach(item=>{

      list += '<button class="prow" data-diag="' + ex.id + '">' +
        '<span class="prow-i' + (bi === 0 ? " lead" : "") + '">' + icon(iconFor(ex.id), 16) + '</span>' +
        '<span style="flex:1;min-width:0">' +
          '<b>' + esc(ex.name) + (isNewVariant(item.slot, i) ? '<span class="tag-new">New</span>' : '') + '</b>' +
          '<span>' + (sug.w === null ? "find a load" : fmt(sug.w) + " " + S.units) +

        '<span class="prow-n">' + item.sets + ' × ' + item.lo + '–' + item.hi + '</span>' +

    '<p class="eyebrow" style="margin-top:4px">' + estimateMinutes(sess) + ' min · ' +
      sess.blocks.reduce((n,b)=> n + b.items.length * b.items[0].sets, 0) + ' sets</p>' +
    (ahead > 0
      ? '<div class="warn">Comes after ' + esc(nextTitle) + '. Looking ahead only.</div>'
      : '') +

    '<p class="eyebrow">What you will do</p>' + list +
    '<p class="eyebrow" style="margin-top:16px">What it trains</p>' +
    '<div class="tags">' + sess.tags.map(t=>'<span class="tag">' + esc(t) + '</span>').join("") + '</div>' +
    '<p class="lede" style="margin-top:16px;font-size:13px">Tap any exercise to see how it is done. Nothing is logged and the rotation does not move until you start.</p>' +
    '<div style="margin-top:16px">' +
      (ahead > 0
        ? '<button class="btn btn-quiet" data-act="closePreview">Back to ' + esc(nextTitle) + '</button>'
        : '<button class="btn" data-act="start">Start ' + esc(sess.title) + '</button>' +
          '<div style="height:9px"></div><button class="btn btn-ghost" data-act="closePreview">Back</button>') +
    '</div>' +
  '</div></div>';
}

/* ---------- home ---------- */

function viewHome(){
  const i = S.sessionIndex;
  const sess = sessionAt(i);
  const strength = S.history.filter(h => !h.open);
  const last = strength[strength.length - 1];
  const days = last ? daysSinceKey(recDay(last)) : null;
  const totalSets = S.history.reduce((n,h)=> n + h.entries.reduce((m,e)=> m + e.sets.length, 0), 0);
  const totalMins = S.history.reduce((n,h)=> n + (h.minutes || 0), 0);
  const totalVol = S.history.reduce((n,h)=> n + h.entries.reduce((m,e)=>
    m + ((e.track||"load")==="load" ? e.sets.reduce((k,s)=> k + s.w*s.r, 0) : 0), 0), 0);

  const readiness = days === null
    ? "First session. Start light enough that the last set still looks like the first."
    : days === 0 ? "You trained today. Rest is where the adaptation happens — come back tomorrow."
    : days === 1 ? "You trained yesterday. This is the rhythm."
    : days >= 4 ? "It has been " + days + " days. Take 10% off the suggested loads and rebuild from there."
    : days + " days since the last session.";

  /* ---- where you are in the rotation ---- */
  const pos = i % 3;
  const rot = SESSIONS.map((x, n)=>{
    const state = n < pos ? "done" : n === pos ? "next" : "after";
    const when = i + ((n - pos) + 3) % 3;
    return '<button class="rot ' + state + '" data-rot="' + when + '" aria-label="' + esc(x.title) + '">' +
      '<span class="rot-l">' + (state === "next" ? "next" : state === "done" ? "done" : "after") + '</span>' +
      '<b>' + esc(x.title) + '</b></button>';
  }).join("");

  let html = storageWarn() +
    '<div class="panel"><div class="pad">' +
      '<p class="eyebrow">Rotation · tap to look ahead</p>' +
      '<div class="rot-strip">' + rot + '</div>' +
      '<hr class="rule">' +
      '<h1 class="session-title" style="font-size:34px">' + esc(sess.title) + '</h1>' +
      '<p class="lede" style="margin-top:9px">' + esc(sess.blurb) + '</p>' +
      '<p class="contents">' + esc(contentsOf(sess, i)) + '</p>' +
      (isDeload(i) ? '<div class="warn">Deload session. Loads drop to 85% — speed and quality, not strain.</div>' : '') +
      '<p class="eyebrow" style="margin-top:11px">' + estimateMinutes(sess) + ' min · ' +
        sess.blocks.reduce((n,b)=> n + b.items.length * b.items[0].sets, 0) + ' sets · ' + esc(readiness.replace(/\.$/, "")) + '</p>' +
      '<div style="margin-top:16px"><button class="btn" data-act="start">Start ' + esc(sess.title) + '</button></div>' +
      '<div style="height:9px"></div>' +
      '<button class="btn btn-ghost" data-act="preview">See next session ›</button>' +
    '</div></div>' +
    '<div class="panel"><div class="pad">' +
      '<button class="aero-tile" data-act="openPicker">' +
        '<span class="aero-ico">' + icon("run", 21) + '</span>' +
        '<span style="min-width:0"><b>Aerobic session</b>' +
        '<span>A run, ride, intervals or mobility. Does not use a slot — ' + esc(sess.title) + ' stays next.</span></span>' +
      '</button>' +
    '</div></div>';

  /* ---- anything waiting to be filled in ---- */
  const unrated = S.history.filter(h => !h.effort && daysSinceKey(recDay(h)) <= 7);
  if(unrated.length){
    const recent = unrated.slice(-3).reverse();
    const more = unrated.length - recent.length;
    html += '<div class="panel"><div class="pad">' +
      '<p class="eyebrow">Effort not recorded</p>' +
      '<p class="lede" style="margin-bottom:10px">Tap a session to say how hard it felt.</p>' +
      recent.map(h=>{
        const idx = S.history.indexOf(h);
        const sets = h.entries.reduce((n,e)=> n + e.sets.length, 0);
        return '<button class="histrow" data-hopen="' + idx + '">' +
          '<span class="ex-icon' + (h.open ? "" : " lead") + '">' +
            icon(h.open && h.entries[0] ? iconFor(h.entries[0].exId) : "barbell", 18) + '</span>' +
          '<span style="flex:1;min-width:0">' +
            '<b>' + esc(sessionTitle(h)) + '</b>' +
            '<span>' + esc(recDateLabel(h)) + ' · ' + sets + ' sets</span>' +
          '</span><span class="chev-r">›</span></button>';
      }).join("") +
      (more > 0
        ? '<div style="margin-top:12px"><button class="btn btn-ghost" data-act="histList">' +
          more + ' more without effort</button></div>'
        : "") +
    '</div></div>';
  }

  /* ---- the nine-session block ---- */
  const bb    = blockBounds(i);
  const bDone = blockSessions(i);
  const bAlso = blockAlongside(i);
  const nDone = Object.keys(bDone).length;
  const nAlso = bAlso.reduce((n,g)=> n + g.n, 0);
  const varNo = Math.floor(cycleAt(bb.start) / ROTATE_EVERY) % 4;

  let cells = '<span class="rgl"></span>' +
    SESSIONS.map(x => '<span class="rgl">' + esc(x.title.toUpperCase()) + '</span>').join("");

  let prevDay = null;
  for(let c = 0; c < ROTATE_EVERY; c++){
    cells += '<span class="rgl">' + (c + 1) + '</span>';
    for(let p = 0; p < 3; p++){
      const n   = bb.start + c * 3 + p;
      const rec = bDone[n];
      if(rec){
        const day  = recDay(rec.h);
        const gap  = prevDay ? dayGap(prevDay, day) : 2;
        const late = gap > 2;
        prevDay = day;
        cells += '<button class="rbx ' + (late ? "late" : "on") + '" data-hopen="' + rec.i + '" ' +
          'aria-label="' + esc(sessionTitle(rec.h)) + ' on ' + esc(shortDate(day)) + '">' +
          esc(shortDate(day)) +
          (late ? '<small>+' + (gap - 2) + ' day' + (gap - 2 > 1 ? "s" : "") + '</small>' : "") +
          '</button>';
      }else{
        const due   = dueDay(n);
        const today = dayKey(new Date());
        const nm    = sessionAt(n).title;
        const lab   = (n === i && due <= today) ? "Today" : shortDate(due);
        cells += '<button class="rbx ' + (n === i ? "next" : "due") + '" data-rot="' + n + '" ' +
          'aria-label="' + esc(nm) + ' due ' + esc(shortDate(due)) + ', see what is coming">' +
          esc(lab) + '</button>';
      }
    }
  }

  cells += '<span class="rgl" style="color:var(--green)">ALSO</span>';
  for(let p = 0; p < 3; p++){
    const g = bAlso[p];
    cells += g
      ? '<button class="rgb" data-histex="' + esc(g.exId) + '" aria-label="Every ' + esc(g.name) + '">' +
          '<span style="display:flex">' + icon(iconFor(g.exId), 14) + '</span>' + g.n + '</button>'
      : '<div class="rgb none">·</div>';
  }

  html += '<div class="panel"><div class="pad">' +
    '<p class="eyebrow">Rhythm · variation ' + (varNo + 1) + ' of 4</p>' +
    '<h2 class="head">' + nDone + ' of 9 sessions' + (nAlso ? ' · ' + nAlso + ' alongside' : "") + '</h2>' +
    '<p class="lede" style="margin-top:4px">' +
      (nDone >= 9 ? "Block complete. Everything advances next session."
       : nDone === 0 ? "Nothing logged in this block yet."
       : (9 - nDone) + " to go until every exercise advances" +
         ", on " + esc(shortDate(dueDay(bb.end + 1))) + " at this cadence.") + '</p>' +
    '<div class="rgrid">' + cells + '</div>' +
    '<div class="rkey">' +
      '<span><i style="background:var(--orange)"></i>Sessions</span>' +
      '<span><i style="background:var(--green)"></i>Alongside</span>' +
      '<span><i style="background:var(--orange-deep)"></i>Ran late</span>' +
    '</div>' +
    '<p class="lede" style="font-size:12px;margin-top:10px">Nine sessions — each exercise three times — then every slot moves on. Aerobic and open sessions sit alongside and do not use a slot. Tap anything to look inside.</p>' +
  '</div></div>';

  /* ---- totals ---- */
  html += '<div class="panel"><div class="pad"><div class="meta" style="margin-top:0">' +
      '<div><button class="n numlink" data-act="histList">' + strength.length + '</button><span class="l">Sessions</span></div>' +
      '<div><span class="n">' + totalMins + '</span><span class="l">Minutes</span></div>' +
      '<div><span class="n">' + totalSets + '</span><span class="l">Sets</span></div>' +
    '</div></div></div>';

  /* ---- movement on the three primaries ---- */
  if(S.history.length){
    const primaries = [["squat","Drive"],["deadlift","Root"],["vpullHeavy","Reach"]];
    let rows = "";
    primaries.forEach(pair=>{
      const perf = slotPerf(pair[0]);
      const cur = variantFor(pair[0], i);
      if(!perf.length){
        rows += '<div class="exrow"><div class="exrow-top">' +
          '<span class="exrow-name">' + esc(pair[1]) + '</span>' +
          '<span class="exrow-n" style="color:var(--slate)">—</span></div>' +
          '<div class="exrow-sub">' + esc(cur.name) + ' · not logged yet</div></div>';
        return;
      }
      const latest = perf[perf.length - 1], first = perf[0];
      const hasSingle = perf.some(x => x.single !== null);
      const curV = hasSingle ? latest.single : latest.top;
      const firstV = hasSingle ? (first.single !== null ? first.single : first.top) : first.top;
      const d = curV - firstV;
      const cls = d > 0.5 ? "delta-up" : d < -0.5 ? "delta-down" : "delta-flat";
      const lf = findEx(latest.exId);
      rows += '<div class="exrow">' +
        '<div class="exrow-top">' +
          '<span class="exrow-name">' + esc(pair[1]) + '</span>' +
          '<span class="exrow-n">' + fmt(curV) + ' ' + S.units + '</span>' +
        '</div>' +
        '<div class="exrow-sub">' + esc(lf ? lf.ex.name : "") + ' · ' + (hasSingle ? "one-rep max" : "heaviest set") +
          ' · ' + perf.length + ' logged · ' +
          '<span class="' + cls + '">' + (d > 0 ? "+" : "") + fmt(d) + ' ' + S.units + ' since you started</span></div>' +
        sparkline(perf.map(x => (hasSingle && x.single !== null) ? x.single : x.top)) +
      '</div>';
    });
    html += '<div class="panel"><div class="pad">' +
      '<p class="eyebrow">Your main lifts</p>' +
      '<p class="lede" style="margin-bottom:6px">The lift each session is built on. Take one to a true single and it switches from heaviest set to a one-rep max.</p>' +
      rows +
      '<div style="margin-top:14px"><button class="btn btn-ghost" data-tab="progress">See every exercise</button></div>' +
    '</div></div>';
  }

  /* ---- everything else you have logged ---- */
  const avgs = activityAverages();
  const recentX = recentExtraSessions(5);
  if(avgs.length || recentX.length){
    html += '<div class="panel"><div class="pad">' +
      '<p class="eyebrow">Everything else</p>';

    if(recentX.length){
      html += '<div class="xstrip">' + recentX.map(r=>{
        const first = r.h.entries.find(e => e.extra) || r.h.entries[0];
        const hd = entryHeadline(first);
        return '<button class="xcell" data-hopen="' + r.i + '">' +
          '<span class="xico">' + icon(iconFor(first.exId), 20) + '</span>' +
          '<b>' + (hd ? fmt(Math.round(hd.v * 10) / 10) + (hd.unit ? '<i>' + hd.unit + '</i>' : "") : "—") + '</b>' +
          '<span>' + esc(keyDate(recDay(r.h)).toLocaleDateString("en-GB", {day:"numeric", month:"short"})) + '</span>' +
        '</button>';
      }).join("") + '</div>';
    }

    if(avgs.length){
      html += '<p class="eyebrow" style="margin-top:16px">Averages</p>' +
        avgs.slice(0, 6).map(a=>
          '<div class="avgrow">' +
            '<span class="ex-icon">' + icon(iconFor(a.exId), 17) + '</span>' +
            '<span style="flex:1;min-width:0"><b>' + esc(a.name) + '</b>' +
            '<span>' + a.n + (a.n === 1 ? " time" : " times") + ' · ' + esc(a.word) + '</span></span>' +
            '<span class="avgnum">' + fmt(Math.round(a.avg * 10) / 10) +
              (a.unit ? '<i>' + a.unit + '</i>' : "") + '</span>' +
          '</div>').join("");
    }
    html += '</div></div>';
  }

  /* ---- first run ---- */
  if(!S.history.length){
    html += '<div class="panel"><div class="pad">' +
      '<h2 class="head">How this runs</h2>' +
      '<p class="lede" style="margin-top:8px">Three full-body sessions — Drive, Root, Reach — on rotation, every other day. Each one covers a squat, a hinge, a push, a pull and trunk work, so nothing is neglected across a week.</p>' +
      '<hr class="rule">' +
      '<p class="lede">Log the weight and reps for every set you complete. Next time the app reads what you did and sets the target: hit the top of the rep range on all sets and the load goes up; fall short twice and it backs off 10%. After four cycles every movement swaps to a new variant of the same pattern, so the training stays comparable but never repeats.</p>' +
    '</div></div>';
  }else{
    html += '<div class="panel"><div class="pad">' +
      '<p class="eyebrow">Standing total</p>' +
      '<p style="font-family:var(--mono);font-size:13px;margin:0;color:var(--slate)">' +
        Math.round(totalVol).toLocaleString("en-GB") + ' ' + S.units + ' moved across ' + totalSets + ' sets</p>' +
    '</div></div>';
  }

  return html;
}

function guessProfile(name){
  const n = String(name || "");
  for(const pair of PROFILE_WORDS){ if(pair[0].test(n)) return pair[1]; }
  return null;
}

function guessIcon(name, track){
  const n = String(name || "");
  for(const pair of ICON_WORDS){ if(pair[0].test(n)) return pair[1]; }
  return track === "distance" ? "run" : track === "strength" ? "dumbbell" : track === "golf" ? "golf" : track === "sport" ? "ball" : "clock";
}

  "wave","core","heart","barbell","dumbbell","cable","pullbar","clock"];

function iconFor(exId){
  if(NEW_ICON[exId]) return NEW_ICON[exId];
  if(EXTRA_ICON[exId]) return EXTRA_ICON[exId];
  const f = findEx(exId);
  if(!f) return "clock";
  if(f.ex.icon) return f.ex.icon;
  if(f.ex.cat === "Yours") return guessIcon(f.ex.name, f.track);
  if(f.slot && SLOT_ICON[f.slot]) return SLOT_ICON[f.slot];
  if(f.track === "distance") return "run";
  if(f.track === "time") return "clock";
  const k = f.ex.kind;
  return k === "barbell" ? "barbell" : k === "cable" ? "cable" : k === "bodyweight" ? "pullbar" : "dumbbell";
}

function addExtraToSession(exId){
  if(!S.current) return;
  if(S.current.entries.some(e => e.exId === exId)) return;
  const f = findEx(exId);
  if(!f) return;
  const tr = f.track;
  const cfg = TRACK[tr];
  const lp = lastPerf(exId);
  const seed = lp ? lp.entry.sets.filter(s=>s.done).slice(-1)[0] : null;
  const P = PROFILES[f.profile] || PROFILES.duration;
  S.current.entries.push({
    extra:true, exId:exId, name:f.ex.name, track:tr, profile:f.profile, meta:{},
    sets: P.golf ? [] : [{
      w: seed ? seed.w : (P.a ? P.a.def : 0),
      r: seed ? seed.r : (P.b ? P.b.def : 0), done:false}]
  });
  addOpen = false;
  save(); render();
}

/* ---------- set rows, adapted to what is being tracked ---------- */
function entryProfile(entry){
  /* The exercise definition is the authority. An entry logged before a
     profile existed carries a stale one, and would otherwise render with
     the wrong fields for ever. */
  const f = findEx(entry.exId);
  if(f && f.ex && f.ex.cat === "Yours"){
    /* One you created. A change made deliberately in the Library is final.
       Otherwise the name decides, because a choice made while typing the
       name is a guess, not a decision. */
    if(f.ex.profileLocked && f.ex.profile) return f.ex.profile;
    return guessProfile(f.ex.name) || f.ex.profile || "duration";
  }
  if(f && f.profile) return f.profile;
  const guess = guessProfile(entry.name);
  if(guess) return guess;
  return entry.profile || TRACK_TO_PROFILE[entry.track] || "duration";
}

function paceOf(entry){
  const done = entry.sets.filter(s => s.done !== false);
  const km = done.reduce((n,s)=> n + (Number(s.w)||0), 0);
  const min = done.reduce((n,s)=> n + (Number(s.r)||0), 0);
  if(!km || !min) return "";
  const p = min / km;
  const mm = Math.floor(p), ss = Math.round((p - mm) * 60);
  return mm + ":" + String(ss).padStart(2,"0") + " /" + (S.units === "lb" ? "mi" : "km");
}

function field(kind, id, val, cfg, exKind){
  let st = cfg.step;
  if(st === null){ st = exKind ? step(exKind) : 2.5; }
  return '<div class="field grow">' +
    '<button class="step" data-nudge="' + kind + ':-1:' + id + '" aria-label="Less">−</button>' +
    '<input type="number" inputmode="decimal" data-in="' + kind + ':' + id + '" value="' + val + '" aria-label="' + cfg.unit() + '">' +
    '<span class="unit">' + cfg.unit() + '</span>' +
    '<button class="step" data-nudge="' + kind + ':1:' + id + '" aria-label="More">+</button>' +
  '</div>';
}

/* some movements never take added load — they progress on reps alone */
function isBodyweightOnly(exId){
  const f = findEx(exId);
  return !!(f && f.ex && f.ex.bwOnly);
}

function setRows(entry, rest){
  const P = PROFILES[entryProfile(entry)] || PROFILES.duration;
  if(P.golf) return "";
  const f = findEx(entry.exId);
  const exKind = (f && f.ex && f.ex.kind) ? f.ex.kind : null;
  const bwOnly = !!(f && f.ex && f.ex.bwOnly);
  let out = "";
  entry.sets.forEach((st, si)=>{
    const id = entry.exId + ":" + si;
    out += '<div class="set ' + (st.done ? "done" : "") + '">' +
      '<span class="set-n">' + (si + 1) + '</span>' +
      (bwOnly ? "" : field("w", id, st.w, P.a, exKind)) +
      (P.b ? field("r", id, st.r, P.b, exKind) : "") +
      '<button class="tick-btn" data-done="' + id + ':' + rest + '" aria-label="Mark complete"></button>' +
    '</div>';
  });
  if(P.pace){
    const p = paceOf(entry);
    if(p) out += '<div class="derived">' + p + '</div>';
  }
  return out;
}

/* ---------- the detail that is not a set: how it went, where, golf ---------- */
function placesUsed(){
  const seen = [];
  S.history.forEach(h => h.entries.forEach(e=>{
    if(e.meta && e.meta.where && !seen.includes(e.meta.where)) seen.push(e.meta.where);
  }));
  return seen.slice(-6).reverse();
}

function metaBlock(entry, ctx){
  const P = PROFILES[entryProfile(entry)] || PROFILES.duration;
  const m = entry.meta || (entry.meta = {});
  let out = "";

  /* golf renders its own complete card, including how it went and effort */
  if(P.golf) return golfBlock(entry, ctx);

  if(P.where){
    const places = placesUsed().filter(x => x !== m.where);
    out += '<p class="eyebrow" style="margin-top:14px">' + esc(P.where) + '</p>' +
      '<input class="pick" style="margin-bottom:6px" data-meta="where:' + ctx + '" ' +
        'placeholder="Optional" value="' + esc(m.where || "") + '">' +
      (places.length ? '<div class="tags" style="margin-bottom:4px">' +
        places.map(x=>'<button class="tag" data-place="' + esc(x) + ':' + ctx + '">' + esc(x) + '</button>').join("") +
        '</div>' : "");
  }

  if(P.feel){
    out += '<p class="eyebrow" style="margin-top:14px">How it went</p><div class="feel">' +
      P.feel.map((w,i)=>{
        const val = ["low","mid","high"][i];
        return '<button class="feel-b' + (m.feel === val ? " on" : "") + '" data-feel="' + val + ':' + ctx + '">' + esc(w) + '</button>';
      }).join("") + '</div>';
  }
  return out;
}

/* ============================================================
   GOLF — courses from your own book first, OpenGolfAPI as a shortcut.
   The API is free and needs no key. Data is ODbL, attributed in Setup.
   ============================================================ */
const GOLF_API = "https://api.opengolfapi.org/v1";
let courseQ = "", courseHits = [], courseBusy = false, courseErr = "";

function myCourses(){ return (S.courses || []); }

function rememberCourse(c){
  if(!S.courses) S.courses = [];
  const i = S.courses.findIndex(x => x.name.toLowerCase() === c.name.toLowerCase());
  if(i >= 0) S.courses[i] = c; else S.courses.push(c);
  save();
}

async function searchCourses(q){
  courseQ = q; courseErr = "";
  const local = myCourses().filter(c => c.name.toLowerCase().indexOf(q.toLowerCase()) !== -1)
                           .map(c => ({id:"local:" + c.name, name:c.name, city:c.city || "", state:c.state || "", local:true}));
  if(q.length < 3){ courseHits = local; render(); return; }
  courseHits = local; courseBusy = true; render();
  try{
    const r = await fetch(GOLF_API + "/courses/search?q=" + encodeURIComponent(q));
    if(!r.ok) throw new Error("lookup failed");
    const d = await r.json();
    const remote = (d.courses || []).slice(0, 8)
      .filter(c => !local.some(l => l.name.toLowerCase() === c.name.toLowerCase()))
      .map(c => ({id:c.id, name:c.name, city:c.city || "", state:c.state || "", par:c.par}));
    courseHits = local.concat(remote);
  }catch(e){
    courseErr = "Could not reach the course lookup. You can still type it in.";
  }
  courseBusy = false; render();
}

async function pickCourse(entry, hit, ctx){
  const m = entry.meta || (entry.meta = {});
  if(hit.local){
    const c = myCourses().find(x => "local:" + x.name === hit.id);
    m.course = c.name; m.tees = c.tees || []; m.tee = null;
  }else{
    m.course = hit.name; m.tees = []; m.tee = null;
    courseBusy = true; render();
    try{
      const r = await fetch(GOLF_API + "/courses/" + encodeURIComponent(hit.id));
      const d = await r.json();
      const src = d.tees || (d.course && d.course.tees) || [];
      m.tees = src.map(t=>({
        name: t.tee_name || t.name || t.color || "Tee",
        par: Number(t.par_total || t.par || hit.par || 0) || null,
        yards: Number(t.total_yards || t.yards || 0) || null
      })).filter(t => t.name);
    }catch(e){ courseErr = "Course found, but the tee details would not load."; }
    courseBusy = false;
    rememberCourse({name:m.course, city:hit.city, state:hit.state, tees:m.tees});
  }
  courseQ = ""; courseHits = [];
  save(); render();
}

function golfBlock(entry, ctx){
  const m = entry.meta || (entry.meta = {});
  let out = "";

  /* the course is required — nothing else appears until one is chosen */
  if(!m.course){
    out += '<p class="eyebrow">Course · required</p>' +
      '<input class="pick" data-coursesearch="' + ctx + '" placeholder="Start typing a course name" value="' + esc(courseQ) + '" autocomplete="off">' +
      (courseBusy ? '<p class="lede" style="font-size:12px;margin:0 0 8px">Looking…</p>' : "") +
      (courseErr ? '<div class="warn">' + esc(courseErr) + '</div>' : "") +
      (courseHits.length
        ? '<div class="hits">' + courseHits.map((c,i)=>
            '<button class="hit" data-coursepick="' + i + ':' + ctx + '">' +
              '<b>' + esc(c.name) + '</b>' +
              '<span>' + esc([c.city, c.state].filter(Boolean).join(", ")) +
              (c.local ? " · played before" : "") + '</span></button>').join("") + '</div>'
        : "") +
      (courseQ.length >= 3 && !courseBusy
        ? '<button class="mini" data-courseown="' + ctx + '">Use “' + esc(courseQ) + '” as typed</button>'
        : "") +
      '<p class="lede" style="font-size:12px;margin-top:10px">Pick the course and the tees, and the par comes with it.</p>';
    return out;
  }

  out += '<p class="eyebrow">Course</p>' +
    '<div class="chosen"><b>' + esc(m.course) + '</b>' +
    '<button class="mini" data-courseclear="' + ctx + '">Change</button></div>';

  /* tees carry the par */
  const tees = m.tees || [];
  out += '<p class="eyebrow" style="margin-top:16px">Tees played</p>';
  if(tees.length){
    out += '<div class="tees">' + tees.map((t,i)=>
      '<button class="tee-b' + (m.tee === i ? " on" : "") + '" data-tee="' + i + ':' + ctx + '">' +
        '<b>' + esc(t.name) + '</b>' +
        '<span>' + (t.par ? "par " + t.par : "par unknown") + (t.yards ? " · " + t.yards + "y" : "") + '</span>' +
      '</button>').join("") + '</div>';
  }else{
    out += '<div class="teerow">' +
      '<input class="pick" style="margin:0" data-meta="teename:' + ctx + '" placeholder="Which tees?" value="' + esc(m.teeName || "") + '">' +
      '<div class="field" style="width:118px">' +
        '<button class="step" data-parstep="-1:' + ctx + '" aria-label="Less">−</button>' +
        '<input type="number" inputmode="numeric" data-parin="' + ctx + '" value="' + (m.parManual || "") + '" placeholder="par" aria-label="Par">' +
        '<button class="step" data-parstep="1:' + ctx + '" aria-label="More">+</button>' +
      '</div>' +
    '</div>' +
    '<p class="lede" style="font-size:12px;margin-top:6px">No scorecard on file for this course. Enter the par once and it is remembered.</p>';
  }

  /* score */
  const par = golfPar(m);
  out += '<p class="eyebrow" style="margin-top:16px">Overall score</p>' +
    '<div class="field" style="width:170px">' +
      '<button class="step" data-score="-1:' + ctx + '" aria-label="Less">−</button>' +
      '<input type="number" inputmode="numeric" data-scorein="' + ctx + '" value="' + (m.score || "") + '" aria-label="Score">' +
      '<button class="step" data-score="1:' + ctx + '" aria-label="More">+</button>' +
    '</div>' +
    (m.score && par
      ? '<p class="derived" style="margin-top:8px">' + esc(vsPar(m.score, par)) + ' · par ' + par + '</p>'
      : (par ? '<p class="lede" style="font-size:12px;margin-top:8px">Par ' + par + '</p>' : ""));

  /* how it went */
  out += '<p class="eyebrow" style="margin-top:16px">How did you get on</p>' +
    '<div class="feel">' +
      [["bad","Badly"],["mid","OK"],["good","Well"]].map(f=>
        '<button class="feel-b' + (m.feel === f[0] ? " on" : "") + '" data-feel="' + f[0] + ':' + ctx + '">' + f[1] + '</button>'
      ).join("") +
    '</div>';

  /* effort, on the round itself */
  const eff = m.effort || 0;
  let cells = "";
  for(let n = 1; n <= 10; n++){
    cells += '<button class="rpe-c' + (n <= eff ? " on" : "") + (n === eff ? " tip" : "") +
      '" data-geffort="' + n + ':' + ctx + '" aria-label="Effort ' + n + ' out of 10">' + n + '</button>';
  }
  out += '<p class="eyebrow" style="margin-top:16px">Effort</p>' +
    '<div class="rpe">' + cells + '</div>' +
    '<p class="lede" style="font-size:13px;margin-top:7px">' +
      (eff ? '<b>' + eff + '/10</b> · ' + esc(effortWord(eff)) : 'Walked it, buggy, or somewhere between.') + '</p>';

  return out;
}

function golfPar(m){
  const t = (m.tees || [])[m.tee];
  const full = (t && t.par) ? t.par : (Number(m.parManual) || null);
  return full || null;
}
function vsPar(score, par){
  const d = Number(score) - par;
  return d === 0 ? "level par" : (d > 0 ? "+" + d : String(d));
}
